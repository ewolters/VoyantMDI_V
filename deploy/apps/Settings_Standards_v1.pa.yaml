- sSave:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="SAVE STANDARD"
      OnSelect: |-
        =If(IsBlank(sL.Selected.Value) || IsBlank(Trim(sS.Text)) || IsBlank(Trim(sF.Text)) || !IsNumeric(sRate.Text), Notify("Line, size, form and rate are required.", NotificationType.Warning),
         !IsBlank(LookUp(colPB, Line = sL.Selected.Value && Size = Trim(sS.Text) && Form = Trim(sF.Text) && ID <> Coalesce(varP.ID, -1))), Notify("That line already has this size and form.", NotificationType.Warning),
        IfError(Patch(PLAYBOOK, If(IsBlank(varP.ID), Defaults(PLAYBOOK), LookUp(PLAYBOOK, ID = varP.ID)), {Title: sL.Selected.Value & "|" & Trim(sS.Text) & "|" & Trim(sF.Text), Line: sL.Selected.Value, Size: Trim(sS.Text), Form: Trim(sF.Text), Active: varPA,
          Rate: If(IsNumeric(sRate.Text), Value(sRate.Text), Blank()), 'Playbook Efficiency Target': If(IsNumeric(sEff.Text), Value(sEff.Text), Blank()), 'Available Hrs/Shift': If(IsNumeric(sHrs.Text), Value(sHrs.Text), Blank()), units_per_shift: If(IsNumeric(sUps.Text), Value(sUps.Text), Blank()),
          'Line Lead': If(IsNumeric(sHc0.Text), Value(sHc0.Text), Blank()), 'Filler Machine Operator': If(IsNumeric(sHc1.Text), Value(sHc1.Text), Blank()), 'Case Pack Machine Operator': If(IsNumeric(sHc2.Text), Value(sHc2.Text), Blank()), 'Bottle / Cap Feeder': If(IsNumeric(sHc3.Text), Value(sHc3.Text), Blank()), 'Box Maker': If(IsNumeric(sHc4.Text), Value(sHc4.Text), Blank()), Packer: If(IsNumeric(sHc5.Text), Value(sHc5.Text), Blank()), Palletizer: If(IsNumeric(sHc6.Text), Value(sHc6.Text), Blank()), Inspector: If(IsNumeric(sHc7.Text), Value(sHc7.Text), Blank()), 'Bottle Flipper': If(IsNumeric(sHc8.Text), Value(sHc8.Text), Blank()), 'Tube Feeder': If(IsNumeric(sHc9.Text), Value(sHc9.Text), Blank()), 'Partition Placer (211 and 209)': If(IsNumeric(sHc10.Text), Value(sHc10.Text), Blank()), 'Taper Machine Pusher': If(IsNumeric(sHc11.Text), Value(sHc11.Text), Blank()), 'Unscrambler Inspector': If(IsNumeric(sHc12.Text), Value(sHc12.Text), Blank())}),
         Notify("NOT SAVED: " & FirstError.Message, NotificationType.Error),
         Notify("Standard saved", NotificationType.Success); Select(sLoad)))
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      DisplayMode: =If(varCan, DisplayMode.Edit, DisplayMode.Disabled)
      X: =1148
      Y: =766
      Width: =230
      Height: =50
