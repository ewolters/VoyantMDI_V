      OnSelect: |-
        =If(varOutcome = "New fix added",
         Patch(TS_Fixes, LookUp(TS_Fixes, ID = varFixID), {Active: true});
         Patch(TS_Procedures, LookUp(TS_Procedures, ID = varProcID), {Active: true}));
        IfError(
         Patch(TS_Occurrences, Defaults(TS_Occurrences), {
          Ref: ddMLine.Selected.Value & "-" & Text(Now(), "yyyymmdd-hhmmss"), OccurredAt: Now(), Line: ddMLine.Selected.Value,
          Asset: If(ddMAsset.Selected.Value = "(any)", "", ddMAsset.Selected.Value), EquipType: varEquip,
          ShiftDate: If(Hour(Now()) < 6, DateAdd(Today(), -1, TimeUnit.Days), Today()), Shift: If(Hour(Now()) * 60 + Minute(Now()) >= 360 && Hour(Now()) * 60 + Minute(Now()) < 990, 1, 2),
          ShiftKey: ddMLine.Selected.Value & "-" & Text(If(Hour(Now()) < 6, DateAdd(Today(), -1, TimeUnit.Days), Today()), "yyyymmdd") & "-S" & Text(If(Hour(Now()) * 60 + Minute(Now()) >= 360 && Hour(Now()) * 60 + Minute(Now()) < 990, 1, 2)),
          IssueID: varIssueID, FixID: varFixID, Outcome: {Value: varOutcome}, FixLevel: varDoneBy,
          OperatorCouldFix: varOutcome = "Existing fix" && varDoneBy = "Operator",
          RepairMin: Value(txtLDT.Text), EventKey: varEventKey, LinkStatus: {Value: If(IsBlank(varEventKey), "Not on board", "Linked at fix")},
          LinkedBy: If(IsBlank(varEventKey), "", User().Email), LinkedAt: If(IsBlank(varEventKey), Blank(), Now()),
          LoggedBy: User().Email, Notes: txtLNotes.Text, WorkOrder: txtLWO.Text}),
         Notify("NOT SAVED — " & FirstError.Message & "  (try again)", NotificationType.Error),
         Notify("Logged. Guide ranking updated.", NotificationType.Success);
         Reset(txtLDT); Reset(txtLWO); Reset(txtLNotes); Reset(txtNConcern); Reset(txtNApp); Reset(txtNCause); Reset(txtNCM); Reset(txtNCheck); Reset(txtNNR); Reset(addNApp);
         Set(varStep, "done"); Select(btnMRefresh))
      Font: =Font.Arial
      Size: =18
      FontWeight: =FontWeight.Bold
      Fill: =If(!IsBlank(txtLDT.Text) && Coalesce(Value(txtLDT.Text), -1) >= 0, RGBA(0, 72, 81, 1), RGBA(217, 217, 214, 1))
      Color: =If(!IsBlank(txtLDT.Text) && Coalesce(Value(txtLDT.Text), -1) >= 0, RGBA(255, 255, 255, 1), RGBA(117, 120, 123, 1))
