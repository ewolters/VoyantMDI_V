- btnMRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="↻"
      OnSelect: |-
        =IfError(ClearCollect(colLk, Filter(Lookups, Active = true)), Notify("Could not load Lookups — " & FirstError.Message, NotificationType.Error), true);
        ClearCollect(colEq, ForAll(Sort(Filter(colLk, Category.Value = "Equipment"), SortOrder), {Value: Label}));
        ClearCollect(colLines, Lines);
        IfError(ClearCollect(colAssets, Filter(Assets, Active = true)), Notify("Could not load Assets", NotificationType.Warning), true);
        IfError(ClearCollect(colIss, Filter(TS_Issues, Active = true)), Notify("Could not load TS_Issues — " & FirstError.Message, NotificationType.Error), true);
        IfError(ClearCollect(colFix, Filter(TS_Fixes, Active = true)), Notify("Could not load TS_Fixes — " & FirstError.Message, NotificationType.Error), true);
        IfError(ClearCollect(colOcc, Filter(TS_Occurrences, OccurredAt >= DateAdd(Today(), -90, TimeUnit.Days))), Notify("Could not load TS_Occurrences", NotificationType.Warning), true);
        If(!varParamUsed && !IsBlank(Param("equip")), Set(varEquip, Param("equip")); ClearCollect(colEv, With({hr: Filter(HxH_Hourly, Line = ddMLine.Selected.Value && HourStart >= DateAdd(Now(), -24, TimeUnit.Hours)),
          rs: Filter(colLk, Category.Value = "Downtime" && EquipType = varEquip)},
         SortByColumns(ForAll(GroupBy(Filter(Ungroup(Table(
           {t: ForAll(hr, {SK: ShiftKey, R: DT_Reason, M: Coalesce(DT_Minutes, 0), H: HourNo, St: StillDown, HS: HourStart})},
           {t: ForAll(hr, {SK: ShiftKey, R: DT2_Reason, M: Coalesce(DT2_Minutes, 0), H: HourNo, St: false, HS: HourStart})}), t),
           M > 0 && R in rs.Label), SK, R, G),
          {Key: SK & "|" & R, SK: SK, R: R, Mn: Sum(G, M), H1: Min(G, H), H2: Max(G, H), Still: CountIf(G, St) > 0, Last: Max(G, HS), First: Min(G, HS)}),
          "Last", SortOrder.Descending))); Set(varStep, "event"));
        Set(varParamUsed, true);
        If(IsBlank(varStep), Set(varStep, "where"));
        Set(varLoaded, Now())
      Font: =Font.Arial
      Size: =16
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      X: =570
      Y: =72
      Width: =54
      Height: =38
      Tooltip: ="Reload the guide from SharePoint."
