- galNews:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: |-
        =SortByColumns(AddColumns(Filter(colNews,
         (ddFLine.Selected.Value = "All lines" || Line = ddFLine.Selected.Value) &&
         (ddFSrc.Selected.Value = "All sources" || Source.Value = ddFSrc.Selected.Value) &&
         (ddFQ.Selected.Value = "All SQDCP" || SQDCP.Value = ddFQ.Selected.Value) &&
         (ddFStat.Selected.Value = "All" || (ddFStat.Selected.Value = "Open + In progress" && (Status.Value = "Open" || Status.Value = "In progress")) || Status.Value = ddFStat.Selected.Value) &&
         (!varOverOnly || ((Status.Value = "Open" || Status.Value = "In progress") && !IsBlank(DueDate) && DueDate < Today())) && (!varMine || OwnerEmail = User().Email) &&
         (IsBlank(txtFSearch.Text) || txtFSearch.Text in Action || txtFSearch.Text in Owner || txtFSearch.Text in Problem || txtFSearch.Text in RefKey)), Late, If(((Status.Value = "Open" || Status.Value = "In progress") && !IsBlank(DueDate) && DueDate < Today()), 0, 1), DueSort, Coalesce(DueDate, Date(2099, 1, 1))), "Late", SortOrder.Ascending, "DueSort", SortOrder.Ascending)
