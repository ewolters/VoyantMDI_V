- btnNSave:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(!IsBlank(txtNAct.Text) && (IsBlank(txtNDue.Text) || !IsError(DateValue(txtNDue.Text))), "SAVE", "ACTION REQUIRED")
      OnSelect: |-
        =IfError(
         If(varNNew,
          Set(varNID, Patch(Newspaper, Defaults(Newspaper), {Action: txtNAct.Text, Problem: txtNProb.Text, Countermeasure: txtNCM.Text,
         Owner: If(ddNOwn.Selected.Value = "(unassigned)", "", ddNOwn.Selected.Value), OwnerEmail: ddNOwn.Selected.Email,
         DueDate: If(IsBlank(txtNDue.Text), Blank(), DateValue(txtNDue.Text)), Line: txtNLine.Text,
         ValueStream: Coalesce(LookUp(colLines, Line = txtNLine.Text).ValueStream, ""),
         SQDCP: {Value: ddNQ.Selected.Value}, Source: {Value: ddNSrc.Selected.Value}, Status: {Value: varNStat}, Progress: varNProg,
         ClosedDate: If(varNStat = "Done", Coalesce(LookUp(colNews, ID = varNID).ClosedDate, Now()), Blank())}, {RaisedDate: Now(), RefKey: "N" & Text(Now(), "yyyymmdd-hhmmss")}).ID); Set(varNNew, false),
          Patch(Newspaper, LookUp(Newspaper, ID = varNID), {Action: txtNAct.Text, Problem: txtNProb.Text, Countermeasure: txtNCM.Text,
         Owner: If(ddNOwn.Selected.Value = "(unassigned)", "", ddNOwn.Selected.Value), OwnerEmail: ddNOwn.Selected.Email,
         DueDate: If(IsBlank(txtNDue.Text), Blank(), DateValue(txtNDue.Text)), Line: txtNLine.Text,
         ValueStream: Coalesce(LookUp(colLines, Line = txtNLine.Text).ValueStream, ""),
         SQDCP: {Value: ddNQ.Selected.Value}, Source: {Value: ddNSrc.Selected.Value}, Status: {Value: varNStat}, Progress: varNProg,
         ClosedDate: If(varNStat = "Done", Coalesce(LookUp(colNews, ID = varNID).ClosedDate, Now()), Blank())}));
         If(!IsBlank(addNPh.Media), Patch(TS_Photos, LookUp(TS_Photos, ID = Value('MDI-UploadPhoto'.Run(JSON(addNPh.Media, JSONFormat.IncludeBinaryData), "N" & varNID & ".jpg", varNID, 0, 0, "After", txtNAct.Text, User().Email).photoid)),
           {Module: {Value: "Newspaper"}, RefID: varNID})),
         Notify("NOT SAVED — " & FirstError.Message, NotificationType.Error),
         Notify("Action saved", NotificationType.Success); Select(btnNRefresh); Select(btnNReset))
      Font: =Font.Arial
      Size: =15
      FontWeight: =FontWeight.Bold
      Fill: =If(!IsBlank(txtNAct.Text) && (IsBlank(txtNDue.Text) || !IsError(DateValue(txtNDue.Text))), RGBA(0, 72, 81, 1), RGBA(217, 217, 214, 1))
