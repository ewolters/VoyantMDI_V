- nLoad:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =Set(varNc0, DateAdd(Today(), -365, TimeUnit.Days));
        IfError(ClearCollect(colNcr, Filter(NCR, RaisedAt >= varNc0)), Notify("Could not load NCR: " & FirstError.Message, NotificationType.Error), true);
        IfError(ClearCollect(colNcDef, Sort(Filter(Lookups, Category.Value = "NCR defect" && Active = true), SortOrder)), Notify("Could not load NCR defects from Lookups", NotificationType.Warning), true);
        Set(varNcDue, Coalesce(Value(LookUp(MDI_Config, Title = "NCR_DueDays").SettingValue), 30));
        Set(varNcNewsLink, LookUp(MDI_Config, Title = "App_Newspaper").SettingValue);
        If(!IsBlank(varNc), Set(varNc, LookUp(colNcr, ID = varNc.ID)));
        If(IsBlank(varNcStep), Set(varNcStep, 1));
        Set(varNcLoaded, Now())
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 0, 0, 0)
      Color: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(0, 0, 0, 0)
      BorderColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(0, 0, 0, 0)
      TabIndex: =-1
      X: =0
      Y: =1079
      Width: =1
      Height: =1
