- galNcr:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: |-
        =SortByColumns(Filter(colNcr,
          Switch(Coalesce(varNcF, "open"), "open", !(Status.Value in ["Closed", "Void"]), "closed", Status.Value = "Closed", true),
          nDdFLine.Selected.Value = "All lines" || Line = nDdFLine.Selected.Value,
          IsBlank(nTxtFind.Text) || nTxtFind.Text in (Title & " " & Job & " " & Lot & " " & ProductForm & " " & DefectCategory & " " & Party & " " & Owner)),
         "RaisedAt", SortOrder.Descending)
      TemplateSize: =96
      TemplatePadding: =0
      ShowScrollbar: =true
      X: =20
      Y: =268
      Width: =624
      Height: =798
    Children:
      - gNcSel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(!IsBlank(varNc) && varNc.ID = ThisItem.ID, RGBA(176, 227, 228, 1), RGBA(255, 255, 255, 1))
            X: =0
            Y: =0
            Width: =620
            Height: =90
      - gNcBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Switch(ThisItem.Status.Value, "Open", RGBA(207, 34, 46, 1), "Contained", RGBA(191, 135, 0, 1), "Dispositioned", RGBA(130, 80, 223, 1), "CA in progress", RGBA(9, 105, 218, 1), "Closed", RGBA(46, 160, 67, 1), RGBA(117, 120, 123, 1))
            X: =0
            Y: =0
            Width: =6
            Height: =90
      - gNcNo:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =Coalesce(ThisItem.Title, "NCR #" & ThisItem.ID)
            Font: =Font.Arial
            Size: =14
            Color: =RGBA(7, 39, 45, 1)
            FontWeight: =FontWeight.Bold
            X: =14
            Y: =4
            Width: =200
            Height: =30
      - gNcSt:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Status.Value
            Font: =Font.Arial
            Size: =10
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =Switch(ThisItem.Status.Value, "Open", RGBA(207, 34, 46, 1), "Contained", RGBA(191, 135, 0, 1), "Dispositioned", RGBA(130, 80, 223, 1), "CA in progress", RGBA(9, 105, 218, 1), "Closed", RGBA(46, 160, 67, 1), RGBA(117, 120, 123, 1))
            X: =214
            Y: =8
            Width: =130
            Height: =24
      - gNcSev:
          Control: Label@2.5.1
          Properties:
            Text: =Upper(ThisItem.Severity.Value)
            Font: =Font.Arial
            Size: =10
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =Switch(ThisItem.Severity.Value, "Critical", RGBA(130, 7, 30, 1), "Major", RGBA(207, 34, 46, 1), RGBA(191, 135, 0, 1))
            X: =352
            Y: =8
            Width: =90
            Height: =24
      - gNcAge:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(ThisItem.Status.Value in ["Closed", "Void"], "closed " & Text(ThisItem.ClosedAt, "m/d"),
               !IsBlank(ThisItem.DueDate) && ThisItem.DueDate < Today(), "OVERDUE " & DateDiff(ThisItem.DueDate, Today()) & "d",
               DateDiff(ThisItem.RaisedAt, Now(), TimeUnit.Days) & "d open")
            Font: =Font.Arial
            Size: =11
            Color: =If(!(ThisItem.Status.Value in ["Closed", "Void"]) && !IsBlank(ThisItem.DueDate) && ThisItem.DueDate < Today(), RGBA(207, 34, 46, 1), RGBA(117, 120, 123, 1))
            FontWeight: =FontWeight.Bold
            Align: =Align.Right
            X: =446
            Y: =4
            Width: =164
            Height: =30
      - gNcWhat:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(Coalesce(ThisItem.NCType.Value, "Product") <> "Product", Upper(ThisItem.NCType.Value) & If(IsBlank(ThisItem.Clause), "", "  ·  ISO " & ThisItem.Clause) & If(IsBlank(ThisItem.AuditRef), "", "  ·  " & ThisItem.AuditRef) & "  ·  ", "") & Coalesce(ThisItem.DefectCategory, "—") & If(Coalesce(ThisItem.QtyAffected, 0) > 0, "  ·  " & Text(ThisItem.QtyAffected, "#,##0") & " " & ThisItem.Unit.Value, "") & "  ·  " & ThisItem.Source.Value
            Font: =Font.Arial
            Size: =12
            Color: =RGBA(7, 39, 45, 1)
            Wrap: =false
            X: =14
            Y: =34
            Width: =600
            Height: =26
      - gNcWhere:
          Control: Label@2.5.1
          Properties:
            Text: ="Line " & ThisItem.Line & If(IsBlank(ThisItem.ProductForm), "", "  ·  " & ThisItem.ProductForm) & If(IsBlank(ThisItem.Job), "", "  ·  job " & ThisItem.Job) & If(IsBlank(ThisItem.Lot), "", "  ·  lot " & ThisItem.Lot) & "  ·  " & Coalesce(ThisItem.Owner, "no owner")
            Font: =Font.Arial
            Size: =10
            Color: =RGBA(117, 120, 123, 1)
            Wrap: =false
            X: =14
            Y: =60
            Width: =600
            Height: =24
      - gNcTap:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            OnSelect: =Set(varNcNew, false); Set(varNc, ThisItem); Set(varNcStep, Switch(ThisItem.Status.Value, "Open", 2, "Contained", 3, "Dispositioned", 4, "CA in progress", 5, 5)); Select(nReset); Select(nSide)
            Font: =Font.Arial
            Size: =12
            FontWeight: =FontWeight.Bold
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 178, 169, 0.08)
            BorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 178, 169, 0.15)
            X: =0
            Y: =0
            Width: =620
            Height: =90
