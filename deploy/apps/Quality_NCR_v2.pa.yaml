         Notify("NOT REOPENED: " & FirstError.Message, NotificationType.Error), Notify("Reopened.", NotificationType.Success); Select(nLoad))
      Font: =Font.Arial
      Size: =16
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(191, 135, 0, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      Visible: =(varNcNew || !IsBlank(varNc)) && (!varNcNew && !IsBlank(varNc) && (varNc.Status.Value = "Closed" || varNc.Status.Value = "Void"))
      Tooltip: ="Reopen a closed or voided NCR (the history stamps are kept)."
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =1572
      Y: =990
      Width: =320
      Height: =64
