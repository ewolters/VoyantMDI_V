- ddDate:
    Control: Classic/DropDown@2.3.1
    Properties:
      Items: |-
        =ForAll(Sequence(30, 0), With({d: DateAdd(Today(), -Value, TimeUnit.Days)}, {Value: Text(d, "ddd m/d"), D: d}))
      Default: =Text(DateAdd(Today(), -1, TimeUnit.Days), "ddd m/d")
      OnChange: =Select(btnRefresh)
      Font: =Font.Arial
      Size: =15
      FontWeight: =FontWeight.Bold
      X: =840
      Y: =28
      Width: =190
      Height: =52
- btnRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="REFRESH"
      OnSelect: |-
        =If(IsBlank(varPer), Set(varPer, "DAY"));
        Set(varD, ddDate.Selected.D); Set(varD0, DateAdd(varD, -6, TimeUnit.Days)); Set(varR0, If(Date(Year(varD), Month(varD), 1) < varD0, Date(Year(varD), Month(varD), 1), varD0)); Set(varD1, DateAdd(varD, 1, TimeUnit.Days));
        IfError(ClearCollect(colCfg, MDI_Config), Notify("Tier 3: could not load MDI_Config", NotificationType.Error), true);
        Set(varAG, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainGreen").SettingValue, "90")));
        Set(varAA, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainAmber").SettingValue, "80")));
        Set(varOG, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEGreen").SettingValue, "65")));
        Set(varOA, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEAmber").SettingValue, "50")));
        Set(varRA, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkAmber").SettingValue, "0.5")));
        Set(varRR, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkRed").SettingValue, "2")));
        Set(varPCG, Value(Coalesce(LookUp(colCfg, Title = "T2_PCGreen").SettingValue, "90")));
        Set(varDA, Value(Coalesce(LookUp(colCfg, Title = "T2_DTAmber").SettingValue, "30")));
        Set(varDR, Value(Coalesce(LookUp(colCfg, Title = "T2_DTRed").SettingValue, "60")));
        Set(varTSReq, Value(Coalesce(LookUp(colCfg, Title = "T2_TSRequiredMin").SettingValue, "15")));
        IfError(ClearCollect(colLines, Sort(Filter(Lines, Active), DisplayOrder)), Notify("Tier 3: could not load Lines", NotificationType.Error), true);
        IfError(ClearCollect(colPB, PLAYBOOK), Notify("Tier 3: could not load PLAYBOOK", NotificationType.Error), true);
        IfError(ClearCollect(colMR, Filter(Lookups, Category.Value = "Downtime")), Notify("Tier 3: could not load Lookups (downtime reasons)", NotificationType.Error), true);
        RemoveIf(colMR, IsBlank(EquipType));
        Set(varCanLink, Coalesce(LookUp(People, Email = User().Email).CanLinkDowntime, false));
        IfError(ClearCollect(colShift, Filter(HxH_Shift, ShiftDate >= varR0 && ShiftDate < varD1)), Notify("Tier 3: could not load HxH_Shift", NotificationType.Error), true);
        IfError(ClearCollect(colHrDay, Filter(HxH_Hourly, ShiftDate >= varD && ShiftDate < varD1)), Notify("Tier 3: could not load HxH_Hourly (day)", NotificationType.Error), true);
        IfError(ClearCollect(colDTH, Filter(HxH_Hourly, ShiftDate >= varR0 && ShiftDate < varD1 && (DT_Minutes > 0 || DT2_Minutes > 0))), Notify("Tier 3: could not load HxH_Hourly (downtime)", NotificationType.Error), true);
        IfError(ClearCollect(colSafe, Filter(HxH_Hourly, ShiftDate >= varR0 && ShiftDate < varD1 && SafetyEvent = true)), Notify("Tier 3: could not load HxH_Hourly (safety)", NotificationType.Error), true);
        IfError(ClearCollect(colFA, Filter(SAF_Audits, AuditDate >= varR0 && AuditDate < varD1)), Notify("Tier 3: could not load SAF_Audits (safety audits)", NotificationType.Error), true);
        IfError(ClearCollect(colFR, Filter(SAF_Results, AuditDate >= varR0 && AuditDate < varD1)), Notify("Tier 3: could not load SAF_Results (safety audits)", NotificationType.Error), true);
        RemoveIf(colFR, !(Rating.Value = "AR" || Rating.Value = "U" || (Rating.Value = "Deficient" && SafetyRelevant)));
        IfError(ClearCollect(colQA, Filter(QA_Rework, ShiftDate >= varR0 && ShiftDate < varD1 && Voided = false)), Notify("Tier 3: could not load QA_Rework", NotificationType.Error), true);
        IfError(ClearCollect(colTSAll, Filter(TS_Occurrences, ShiftDate >= varD0 && ShiftDate < varD1)), Notify("Tier 3: could not load TS_Occurrences", NotificationType.Error), true);
        ClearCollect(colTS, Filter(colTSAll, LinkStatus.Value <> "Waived")); ClearCollect(colWv, Filter(colTSAll, LinkStatus.Value = "Waived"));
        IfError(ClearCollect(colIss, TS_Issues), Notify("Tier 3: could not load TS_Issues", NotificationType.Error), true);
        IfError(ClearCollect(colFix, TS_Fixes), Notify("Tier 3: could not load TS_Fixes", NotificationType.Error), true);
        IfError(ClearCollect(colPC, Filter(PC_Audits, ShiftDate >= varD0 && ShiftDate < varD1)), Notify("Tier 3: could not load PC_Audits", NotificationType.Error), true);
        IfError(ClearCollect(colRes, Filter(PC_Results, Created >= varR0 && Created < varD1)), Notify("Tier 3: could not load PC_Results", NotificationType.Error), true);
        IfError(ClearCollect(colEl, SW_Elements), Notify("Tier 3: could not load SW_Elements", NotificationType.Error), true);
        IfError(ClearCollect(colCards, Filter(PC_Cards, Active = true)), Notify("Tier 3: could not load PC_Cards", NotificationType.Error), true);
        IfError(ClearCollect(colEsc, Filter(Escalation_Log, NotifiedAt >= DateAdd(varD0, -1, TimeUnit.Days) && NotifiedAt < DateAdd(varD1, 1, TimeUnit.Days))), Notify("Tier 3: could not load Escalation_Log", NotificationType.Error), true);
        IfError(ClearCollect(colNews, Filter(Newspaper, Status.Value = "Open" || Status.Value = "In progress" || ClosedDate >= varD0)), Notify("Tier 3: could not load Newspaper", NotificationType.Error), true);
        IfError(ClearCollect(colMet, ForAll(Sort(Filter(KPI_Metrics, Active), DisplayOrder), {Code: Title, Ltr: Letter.Value, Nm: MetricName, Sh: Short, Un: Unit, Hi: Better.Value = "Higher", Gr: Coalesce(Green, 0), Am: Coalesce(Amber, 0), Ord: Coalesce(DisplayOrder, 0)})), Notify("Tier 3: could not load KPI_Metrics", NotificationType.Error), true);
        If(CountRows(colMet) = 0, ClearCollect(colMet, Table({Code: "SAF_EVENTS", Ltr: "S", Nm: "Board safety events", Sh: "Events", Un: "events", Hi: false, Gr: 0, Am: 0, Ord: 10}, {Code: "SAF_HAZ", Ltr: "S", Nm: "Safety-audit hazards", Sh: "Hazards", Un: "hazards", Hi: false, Gr: 0, Am: 99, Ord: 20}, {Code: "SAF_AUD", Ltr: "S", Nm: "Safety audits completed", Sh: "Audits", Un: "audits / week", Hi: true, Gr: 5, Am: 3, Ord: 30}, {Code: "QUAL_RW", Ltr: "Q", Nm: "Rework", Sh: "Rework", Un: "% of units", Hi: false, Gr: 0.5, Am: 2, Ord: 40}, {Code: "QUAL_SCRAP", Ltr: "Q", Nm: "Scrap", Sh: "Scrap", Un: "% of units", Hi: false, Gr: 0.5, Am: 1, Ord: 50}, {Code: "QUAL_NCR", Ltr: "Q", Nm: "NCRs", Sh: "NCRs", Un: "NCRs", Hi: false, Gr: 0, Am: 1, Ord: 60}, {Code: "DEL_ATT", Ltr: "D", Nm: "Attainment to plan", Sh: "Attain", Un: "% of plan", Hi: true, Gr: 90, Am: 80, Ord: 70}, {Code: "DEL_DT", Ltr: "D", Nm: "Unplanned downtime", Sh: "Down", Un: "min / shift", Hi: false, Gr: 30, Am: 60, Ord: 80}, {Code: "DEL_DTE", Ltr: "D", Nm: "Downtime events", Sh: "Events", Un: "events / shift", Hi: false, Gr: 1, Am: 2, Ord: 90}, {Code: "COST_OEE", Ltr: "C", Nm: "OEE", Sh: "OEE", Un: "%", Hi: true, Gr: 65, Am: 50, Ord: 100}, {Code: "COST_SPEED", Ltr: "C", Nm: "Speed loss", Sh: "Speed", Un: "% below target rate", Hi: false, Gr: 5, Am: 10, Ord: 110}, {Code: "PEO_CREW", Ltr: "P", Nm: "Crew vs standard", Sh: "Crew", Un: "% of standard", Hi: true, Gr: 100, Am: 100, Ord: 120}, {Code: "PEO_PC", Ltr: "P", Nm: "Process confirmation", Sh: "PC", Un: "% done", Hi: true, Gr: 90, Am: 75, Ord: 130})));
        Set(varHdS, First(SortByColumns(Filter(colMet, Ltr = "S"), "Ord", SortOrder.Ascending)).Code);
        Set(varHdQ, First(SortByColumns(Filter(colMet, Ltr = "Q"), "Ord", SortOrder.Ascending)).Code);
        Set(varHdD, First(SortByColumns(Filter(colMet, Ltr = "D"), "Ord", SortOrder.Ascending)).Code);
        Set(varHdC, First(SortByColumns(Filter(colMet, Ltr = "C"), "Ord", SortOrder.Ascending)).Code);
        Set(varHdP, First(SortByColumns(Filter(colMet, Ltr = "P"), "Ord", SortOrder.Ascending)).Code);
        IfError(ClearCollect(colVS, ForAll(Sort(Filter(ValueStreams, Active), DisplayOrder), {Nm: Title, Up: Coalesce(ParentVS, ""), Ord: Coalesce(DisplayOrder, 0), Leader: Coalesce(Leader, "")})), Notify("Tier 3: could not load ValueStreams", NotificationType.Error), true);
        Collect(colVS, ForAll(Filter(Distinct(colLines, ValueStream), !IsBlank(Value) && !(Value in colVS.Nm)), {Nm: Value, Up: "", Ord: 9000, Leader: ""}));
        Set(varWS, Coalesce(LookUp(colCfg, Title = "T3_WeekStart").SettingValue, "Monday"));
        Set(varT2Link, LookUp(colCfg, Title = "App_Tier2").SettingValue);
        Set(varNewsLink, LookUp(colCfg, Title = "App_Newspaper").SettingValue);
        IfError(
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -12, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -11, TimeUnit.Months)},
         ClearCollect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -11, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -10, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -10, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -9, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -9, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -8, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -8, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -7, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -7, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -6, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -6, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -5, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -5, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -4, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -4, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -3, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -3, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -2, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -2, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -1, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -1, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), -0, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
        With({m0: DateAdd(Date(Year(varD), Month(varD), 1), -0, TimeUnit.Months), m1: DateAdd(Date(Year(varD), Month(varD), 1), --1, TimeUnit.Months)},
         Collect(colKD, Filter(KPI_Daily, KPIDate >= m0 && KPIDate < m1)));
         true, Notify("Tier 3: could not load KPI_Daily history. Run the list setup if the list is missing.", NotificationType.Error), true);
        Set(varLoadedAt, Now());
        Select(btnCalc)
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 178, 169, 1)
      Color: =RGBA(7, 39, 45, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =1040
      Y: =28
      Width: =130
      Height: =52
- lblLoaded:
    Control: Label@2.5.1
    Properties:
      Text: =If(IsBlank(varLoadedAt), "Tap REFRESH", "Updated " & Text(varLoadedAt, "h:mm AM/PM") & Char(10) & If(varWrote < 0, "history NOT saved", varWrote > 0, Text(varWrote) & " day-rows saved to history", "history up to date"))
      Font: =Font.Arial
      Size: =10
      Color: =RGBA(177, 179, 179, 1)
      X: =1180
      Y: =24
      Width: =260
      Height: =60
- lblScope:
    Control: Label@2.5.1
    Properties:
      Text: =If(!IsBlank(varLn), "Line " & varLn, !IsBlank(varVert), varVert, Coalesce(varVS, "Whole plant")) & Char(10) & Switch(varPer, "WEEK", "Week to date · " & Text(varWk, "m/d") & "–" & Text(varD, "m/d"), "MONTH", "Month to date · " & Text(varD, "mmmm"), Text(varD, "dddd m/d"))
      Font: =Font.Arial
      Size: =13
      Color: =RGBA(176, 227, 228, 1)
      FontWeight: =FontWeight.Bold
      Align: =Align.Right
      X: =1450
      Y: =10
      Width: =458
      Height: =70
- btnCalc:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =ClearCollect(colDaily, Ungroup(ForAll(colLines As ln,
          With({nEv: CountRows(Filter(colCards, Frequency.Value = "Every shift" && (Line = "All" || ln.Title in Split(Line, ",")))),
                nDy: CountRows(Filter(colCards, Frequency.Value = "Daily" && (Line = "All" || ln.Title in Split(Line, ","))))},
           {rows: ForAll(Sequence(7, 0) As k,
           With({dD: DateAdd(varD0, k.Value, TimeUnit.Days), L: ln.Title},
           With({dE: DateAdd(dD, 1, TimeUnit.Days), DKy: Text(dD, "yyyymmdd")},
            With({shs: Filter(colShift, Line = L && ShiftDate >= dD && ShiftDate < dE && true),
                   qas: Filter(colQA, Line = L && ShiftDate >= dD && ShiftDate < dE && true),
                   tss: Filter(colTS, Line = L && ShiftDate >= dD && ShiftDate < dE && true),
                   pcs: Filter(colPC, Line = L && ShiftDate >= dD && ShiftDate < dE && true),
                   nws: Filter(colNews, Line = L && RaisedDate < dE && Status.Value <> "Canceled" && (IsBlank(ClosedDate) || ClosedDate >= dE))},
             With({t: Coalesce(Sum(shs, Coalesce(TargetUnits, 0)), 0), a: Coalesce(Sum(shs, Coalesce(ActualUnits, 0)), 0), o: Coalesce(Sum(shs, Coalesce(OEE, 0) * Coalesce(TargetUnits, 0)), 0),
                   sh: CountRows(shs), sc: Coalesce(Sum(shs, Coalesce(FGScrapQty, 0)), 0), ca: Coalesce(Sum(shs, Coalesce(ActualCrewSize, 0)), 0), cs: Coalesce(Sum(shs, Coalesce(StdCrewSize, 0)), 0),
                   dt: Coalesce(Sum(shs, Coalesce(ReportedDowntimeMin, 0)), 0), rw: Coalesce(Sum(qas, Coalesce(ReworkQty, 0)), 0),
                   pt: Coalesce(Sum(shs, With({pb: LookUp(colPB, Title = PlaybookKey)}, If(IsBlank(pb), Coalesce(TargetUnits, 0), Coalesce(Value(Text(pb.UnitsPerHour)), 0) * Max(Coalesce(PlannedShiftHrs, pb.AvailableHrsShift, 0) - (Coalesce(LunchMin, 0) + Coalesce(BreakMin, 0)) / 60, 0)))), 0),
                   effw: Coalesce(Sum(shs, Coalesce(LookUp(colPB, Title = PlaybookKey).EfficiencyTarget, 0) * Coalesce(TargetUnits, 0)), 0),
                   sf: CountRows(Filter(colSafe, Line = L && ShiftDate >= dD && ShiftDate < dE && true)),
                   fz: CountRows(Filter(colFR, Line = L && AuditDate >= dD && AuditDate < dE)), fch: CountRows(Filter(colFR, Line = L && AuditDate >= dD && AuditDate < dE && (Severity.Value = "Critical" || Severity.Value = "High"))),
                   fa: CountRows(Filter(colFA, Line = L && AuditDate >= dD && AuditDate < dE)),
                   tsn: CountRows(tss), tsop: CountIf(tss, OperatorCouldFix), tsnr: CountIf(tss, Outcome.Value = "Not resolved - escalated"), tsu: CountIf(tss, IsBlank(EventKey)),
                   pcd: CountRows(pcs), pcf: CountIf(pcs, Result.Value = "Fail"),
                   esc: CountRows(Filter(colEsc, StartsWith(ShiftKey, L & "-" & DKy) && true)),
                   ao: CountRows(nws), ov: CountIf(nws, DueDate < dD),
                   escl: Coalesce(Max(Filter(colEsc, StartsWith(ShiftKey, L & "-" & DKy) && true), Level), 0)},
              With({pcx: nEv * sh + nDy * If(sh > 0, 1, 0),
                    evs: GroupBy(Filter(Ungroup(Table({t: ForAll(Filter(colDTH, Line = L && ShiftDate >= dD && ShiftDate < dE && true), {K: ShiftKey & "|" & DT_Reason, R: DT_Reason, M: Coalesce(DT_Minutes, 0)})}, {t: ForAll(Filter(colDTH, Line = L && ShiftDate >= dD && ShiftDate < dE && true), {K: ShiftKey & "|" & DT2_Reason, R: DT2_Reason, M: Coalesce(DT2_Minutes, 0)})}), t), M > 0 && !IsBlank(R)), K, R, G)},
              With({dte: CountRows(evs), dtl: Coalesce(Max(ForAll(evs, {v: Coalesce(Sum(G, M), 0)}), v), 0), mnt: CountRows(Filter(evs, R in colMR.Label && Coalesce(Sum(G, M), 0) >= varTSReq && CountRows(Filter(colTS, EventKey = K)) = 0 && CountRows(Filter(colWv, EventKey = K)) = 0))},
