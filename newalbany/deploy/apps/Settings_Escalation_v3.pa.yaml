- eSave:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="SAVE CONTACT"
      OnSelect: |-
        =If(IsBlank(eName.Text) || IsBlank(eMail.Text) || !IsNumeric(eLvl.Text), Notify("Name, e-mail and a level in minutes are required.", NotificationType.Warning),
        IfError(Patch(Escalation_Contacts, If(IsBlank(varE.ID), Defaults(Escalation_Contacts), LookUp(Escalation_Contacts, ID = varE.ID)), {Title: eName.Text, Email: Trim(eMail.Text), Role: eRole.Text, Level: Value(eLvl.Text), ShiftSpecific: varESS,
          Shifts: ForAll(Filter(Table({V: "1", On: varES1}, {V: "2", On: varES2}, {V: "3", On: varES3}), On), {Value: V}), Active: varEA}),
         Notify("NOT SAVED: " & FirstError.Message, NotificationType.Error),
         Notify("Contact saved", NotificationType.Success); Select(eLoad)))
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      DisplayMode: =If(varCan, DisplayMode.Edit, DisplayMode.Disabled)
      X: =1148
      Y: =818
      Width: =240
      Height: =50
