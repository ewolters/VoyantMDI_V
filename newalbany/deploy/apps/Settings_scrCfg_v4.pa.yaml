         IfError(Patch(MDI_Config, LookUp(MDI_Config, ID = varC.ID), {SettingValue: Trim(cVal.Text)}),
          Notify("NOT SAVED: " & FirstError.Message, NotificationType.Error),
          IfError(Patch(Settings_Log, Defaults(Settings_Log), {Title: Left("Thresholds: " & varC.Title, 250), ChangedAt: Now(), ChangedBy: User().FullName, ChangedByEmail: User().Email, Area: "Thresholds", Item: Left(varC.Title, 250), Action: "Changed", Changes: If(IsBlank(chg), "(no field changed)", chg), Reason: Trim(cRsnTxt.Text)}),
          Notify("Saved, but the change log entry failed: " & FirstError.Message, NotificationType.Warning), true);
          Notify("Setting saved", NotificationType.Success); Select(cLoad)))
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 0, 0, 0)
      Color: =RGBA(0, 0, 0, 0)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      TabIndex: =-1
      X: =0
      Y: =1079
      Width: =1
      Height: =1
- cDo2:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =With({o: LookUp(KPI_Metrics, ID = varM.ID)},
         With({chg: Concat(Filter(Table({t: If(Text(o.MetricName) <> Text(cmName.Text), "MetricName: " & If(IsBlank(Text(o.MetricName)), "—", Text(o.MetricName)) & " → " & If(IsBlank(Text(cmName.Text)), "—", Text(cmName.Text)), "")}, {t: If(Text(o.Short) <> Text(cmShort.Text), "Short: " & If(IsBlank(Text(o.Short)), "—", Text(o.Short)) & " → " & If(IsBlank(Text(cmShort.Text)), "—", Text(cmShort.Text)), "")}, {t: If(o.Better.Value <> cmB.Selected.Value, "Better: " & If(IsBlank(o.Better.Value), "—", o.Better.Value) & " → " & If(IsBlank(cmB.Selected.Value), "—", cmB.Selected.Value), "")}, {t: If(Text(o.Green) <> Text(Value(cmG.Text)), "Green: " & If(IsBlank(Text(o.Green)), "—", Text(o.Green)) & " → " & If(IsBlank(Text(Value(cmG.Text))), "—", Text(Value(cmG.Text))), "")}, {t: If(Text(o.Amber) <> Text(Value(cmA.Text)), "Amber: " & If(IsBlank(Text(o.Amber)), "—", Text(o.Amber)) & " → " & If(IsBlank(Text(Value(cmA.Text))), "—", Text(Value(cmA.Text))), "")}, {t: If(Text(o.DisplayOrder) <> Text(If(IsNumeric(cmO.Text), Value(cmO.Text), Blank())), "DisplayOrder: " & If(IsBlank(Text(o.DisplayOrder)), "—", Text(o.DisplayOrder)) & " → " & If(IsBlank(Text(If(IsNumeric(cmO.Text), Value(cmO.Text), Blank()))), "—", Text(If(IsNumeric(cmO.Text), Value(cmO.Text), Blank()))), "")}, {t: If(Text(o.Active) <> Text(varMA), "Active: " & If(IsBlank(Text(o.Active)), "—", Text(o.Active)) & " → " & If(IsBlank(Text(varMA)), "—", Text(varMA)), "")}), !IsBlank(t)), t, "; ")},
         IfError(Patch(KPI_Metrics, LookUp(KPI_Metrics, ID = varM.ID), {MetricName: cmName.Text, Short: cmShort.Text, Better: {Value: cmB.Selected.Value}, Green: Value(cmG.Text), Amber: Value(cmA.Text), DisplayOrder: If(IsNumeric(cmO.Text), Value(cmO.Text), Blank()), Active: varMA}),
          Notify("NOT SAVED: " & FirstError.Message, NotificationType.Error),
          IfError(Patch(Settings_Log, Defaults(Settings_Log), {Title: Left("Metrics: " & "Metric " & varM.Title, 250), ChangedAt: Now(), ChangedBy: User().FullName, ChangedByEmail: User().Email, Area: "Metrics", Item: Left("Metric " & varM.Title, 250), Action: If(IsBlank(o), "Added", o.Active && !(varMA), "Retired", !o.Active && (varMA), "Restored", "Changed"), Changes: If(IsBlank(chg), "(no field changed)", chg), Reason: Trim(cRsnTxt.Text)}),
          Notify("Saved, but the change log entry failed: " & FirstError.Message, NotificationType.Warning), true);
          Notify("Metric saved", NotificationType.Success); Select(cLoad))))
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
