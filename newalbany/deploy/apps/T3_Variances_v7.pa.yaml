- vSave:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="PUT ON THE BOARD"
      OnSelect: |-
        =IfError(Patch(Variances, Defaults(Variances), {Title: vTxtTitle.Text, Kind: {Value: varVK},
          SQDCP: {Value: If(vDdMet.Selected.Code = "", vDdSQ.Selected.Value, Switch(vDdMet.Selected.Ltr, "S", "Safety", "Q", "Quality", "D", "Delivery", "C", "Cost", "People"))},
          SourceKey: If(IsBlank(varPre.K) || varPre.K = "", Blank(), varPre.K),
          ValueStream: If(vDdLevel.Selected.Value = "Plant", Blank(), vDdLevel.Selected.Value), Line: If(vDdLine.Selected.Value = "(none)", Blank(), vDdLine.Selected.Value),
          Metric: If(vDdMet.Selected.Code = "", Blank(), LookUp(colMet, Code = vDdMet.Selected.Code).Nm),
          Magnitude: Value(vTxtMag.Text), Unit: {Value: vDdUnit.Selected.Value}, Detail: vTxtDet.Text, Owner: vTxtOwn.Text,
          RaisedDate: Now(), ShowUntil: If(varVK = "24-hour", DateAdd(Today(), If(Coalesce(varV24, 0) > 0, varV24, 7), TimeUnit.Days), Blank()),
          MonthOf: If(varVK = "Monthly", Coalesce(varVM, Date(Year(Coalesce(varD, Today())), Month(Coalesce(varD, Today())), 1)), Date(Year(Today()), Month(Today()), 1)), Status: {Value: "Open"}, RaisedBy: User().Email});
         Set(varVAdd, false); Select(vLoad); Notify("Variance on the board.", NotificationType.Success),
         Notify("Not saved. Check your connection and try again.", NotificationType.Error), true)
      Font: =Font.Arial
      Size: =13
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(46, 160, 67, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      DisplayMode: =If(IsBlank(vTxtTitle.Text) || IsBlank(vTxtMag.Text) || IsBlank(vTxtOwn.Text), DisplayMode.Disabled, DisplayMode.Edit)
      Visible: =varVAdd
      X: =1176
      Y: =860
      Width: =200
      Height: =52
