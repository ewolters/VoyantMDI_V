- pLoad:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="↻"
      OnSelect: |-
        =Set(varMe, LookUp(People, Lower(Email) = Lower(User().Email)));
        Set(varNoAdmin, CountRows(Filter(People, MDIAdmin = true)) = 0);
        Set(varAdm, Coalesce(varMe.MDIAdmin, false) || varNoAdmin);
        Set(varCan, Coalesce(varMe.CanEditConfig, false) || varAdm);
