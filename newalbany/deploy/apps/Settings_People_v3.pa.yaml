- galP:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: =SortByColumns(Filter(colPpl, (varPAll || Active) && (IsBlank(pF.Text) || pF.Text in Title || pF.Text in Email || pF.Text in Role.Value || pF.Text in Lines)), "Title", SortOrder.Ascending)
      TemplateSize: =46
      TemplatePadding: =0
      ShowScrollbar: =true
      OnSelect: =Set(varPp, ThisItem); Set(varPpA, Coalesce(ThisItem.Active, false)); Set(varPp1, "1" in ThisItem.Shifts.Value); Set(varPp2, "2" in ThisItem.Shifts.Value); Set(varPp3, "3" in ThisItem.Shifts.Value); Set(varPpL, Coalesce(ThisItem.CanLinkDowntime, false)); Set(varPpC, Coalesce(ThisItem.CanEditConfig, false)); Set(varPpM, Coalesce(ThisItem.MDIAdmin, false))
      TemplateFill: =If(ThisItem.ID = varPp.ID, RGBA(229, 243, 243, 1), RGBA(255, 255, 255, 1))
      BorderColor: =RGBA(217, 217, 214, 1)
      BorderThickness: =1
      X: =16
      Y: =294
      Width: =1100
      Height: =776
    Children:
      - gpN:
          Control: Label@2.5.1
          Properties:
            OnSelect: =Select(Parent)
            Text: =ThisItem.Title
            Font: =Font.Arial
            Size: =12
