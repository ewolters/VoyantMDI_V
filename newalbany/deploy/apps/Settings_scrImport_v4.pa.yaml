- iGo:
    Control: Classic/Button@2.2.0
    Properties:
      Visible: =varIScanned
      Text: =If(varIBusy, "IMPORTING…  KEEP THIS OPEN", "IMPORT " & Text(CountRows(colIShifts) - If(varIUpd, 0, varISOld)) & " SHIFTS + " & Text(CountRows(colIHrs) - If(varIUpd, 0, varIHOld)) & " HOURS")
      OnSelect: |-
        =Set(varIBusy, true); Clear(colIErr);
        ForAll(Filter(colIShifts, !(Title in colIExS.Title)) As r, IfError(Collect(HxH_Shift, r), Collect(colIErr, {T: r.Title, M: FirstError.Message}), true));
        If(varIUpd, ForAll(Filter(colIShifts, Title in colIExS.Title) As r, IfError(Patch(HxH_Shift, LookUp(colIExS, Title = r.Title), r), Collect(colIErr, {T: r.Title, M: FirstError.Message}), true)));
        ForAll(Filter(colIHrs, !(Title in colIExH.Title)) As r, IfError(Collect(HxH_Hourly, r), Collect(colIErr, {T: r.Title, M: FirstError.Message}), true));
        If(varIUpd, ForAll(Filter(colIHrs, Title in colIExH.Title) As r, IfError(Patch(HxH_Hourly, LookUp(colIExH, Title = r.Title), r), Collect(colIErr, {T: r.Title, M: FirstError.Message}), true)));
        Set(varIErrs, CountRows(colIErr)); Set(varIErr1, If(varIErrs > 0, First(colIErr).T & ": " & First(colIErr).M, ""));
        Set(varIMsg, If(varIErrs = 0, "DONE: " & varIFile & " imported. " & Text(CountRows(colIShifts) - If(varIUpd, 0, varISOld)) & " shifts and " & Text(CountRows(colIHrs) - If(varIUpd, 0, varIHOld)) & " hours written.",
          "FINISHED: " & Text(varIErrs) & " row(s) did not save, the rest did. First problem: " & varIErr1));
        Notify(varIMsg, If(varIErrs = 0, NotificationType.Success, NotificationType.Warning));
        Set(varIBusy, false); Set(varIScanned, false)
      Font: =Font.Arial
      Size: =16
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(46, 160, 67, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      DisplayMode: =If(varAdm && !varIBusy, DisplayMode.Edit, DisplayMode.Disabled)
      X: =692
      Y: =904
      Width: =620
      Height: =60
