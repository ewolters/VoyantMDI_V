        =Set(varMe, LookUp(People, Lower(Email) = Lower(User().Email)));
        Set(varNoAdmin, CountRows(Filter(People, MDIAdmin = true)) = 0);
        Set(varAdm, Coalesce(varMe.MDIAdmin, false) || varNoAdmin);
        Set(varCan, Coalesce(varMe.CanEditConfig, false) || varAdm);
        Set(varIBusy, true);
        ClearCollect(colIPB, PLAYBOOK);
        ClearCollect(colIDTL, Filter(Lookups, Category.Value = "Downtime"));
        IfError(Set(varIL, 'MDI-ImportHistory'.Run("LIST", "")), Notify("Could not reach the import flow (MDI - Import History). Is it turned on and added to this app? " & FirstError.Message, NotificationType.Error), true);
