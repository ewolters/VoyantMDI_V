- btnRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="REFRESH"
      OnSelect: |-
        =Select(btnFlush);
        ClearCollect(colLk, Filter(Lookups, Active = true));
        ClearCollect(colLkDT, {Value: " ", Help: ""}, ForAll(Sort(Filter(colLk, Category.Value = "Downtime"), SortOrder), {Value: Label, Help: Help}));
        ClearCollect(colLkScrap, {Value: "", Help: ""}, ForAll(Sort(Filter(colLk, Category.Value = "Scrap"), SortOrder), {Value: Label, Help: Help}));
        ClearCollect(colLkSpeed, {Value: "", Help: ""}, ForAll(Sort(Filter(colLk, Category.Value = "Speed loss"), SortOrder), {Value: Label, Help: Help}));
        ClearCollect(colLkStaff, {Value: "", Help: ""}, ForAll(Sort(Filter(colLk, Category.Value = "Extra headcount"), SortOrder), {Value: Label, Help: Help}));
        Set(varShiftKey, ddLine.Selected.Value & "-" & Text(ddDate.Selected.D, "yyyymmdd") & "-S" & ddShift.Selected.Value);
        Set(varKey, varShiftKey & "-H");
        ClearCollect(colRunHist, Filter(HxH_Hourly, Line = ddLine.Selected.Value && ShiftDate >= DateAdd(ddDate.Selected.D, -30, TimeUnit.Days) && ShiftDate <= ddDate.Selected.D));
        With({h: Filter(colRunHist, ShiftKey <> varShiftKey && Coalesce(RunRatePct, 0) > 0 && RunRatePct < 3 && Coalesce(HourlyTarget, 0) > 0)}, Set(varRunN, CountRows(h)); Set(varRunMean, Average(h, RunRatePct)); Set(varRunSD, StdevP(h, RunRatePct)));
        Set(varStarCut, If(varRunN >= 20, Max(1.05, varRunMean + 2 * varRunSD), 1.15));
        Set(varShiftRec, LookUp(HxH_Shift, Title = varShiftKey));
        If(varShiftKey <> Coalesce(varProdKey, ""), Set(varProdKey, varShiftKey); Set(varProd, If(IsBlank(varShiftRec.ProductForm), "— PICK PRODUCT —", varShiftRec.ProductForm)); Set(varProdDef, varProd); Reset(ddProduct));
        Set(varPB, With({f: First(Filter(PLAYBOOK, Line = ddLine.Selected.Value))}, If(Coalesce(varProd, "— PICK PRODUCT —") = "— PICK PRODUCT —", f, Coalesce(LookUp(PLAYBOOK, Line = ddLine.Selected.Value && Size & " | " & Form = varProd), f))));
        Set(varUPH, Coalesce(Value(varPB.'Playbook Units per Hour'), 0));
        Set(varTmax, Coalesce(varPB.Rate, 0));
        Set(varStartM, If(IsBlank(varShiftRec.ActualStartTime), If(ddShift.Selected.Value = "1", 360, 990), Hour(TimeValue(varShiftRec.ActualStartTime)) * 60 + Minute(TimeValue(varShiftRec.ActualStartTime))));
        Set(varEndM, If(IsBlank(varShiftRec.ActualEndTime), If(ddShift.Selected.Value = "1", 990, 180), Hour(TimeValue(varShiftRec.ActualEndTime)) * 60 + Minute(TimeValue(varShiftRec.ActualEndTime))));
        Set(varDurM, With({d0: ddDate.Selected.D}, With({d1: If(varEndM <= varStartM, DateAdd(d0, 1, TimeUnit.Days), d0)}, DateDiff(DateTime(Year(d0), Month(d0), Day(d0), RoundDown(varStartM / 60, 0), Mod(varStartM, 60), 0), DateTime(Year(d1), Month(d1), Day(d1), RoundDown(varEndM / 60, 0), Mod(varEndM, 60), 0), TimeUnit.Minutes))));
        Set(varStart, DateTime(Year(ddDate.Selected.D), Month(ddDate.Selected.D), Day(ddDate.Selected.D), RoundDown(varStartM / 60, 0), Mod(varStartM, 60), 0));
        ClearCollect(colSaved, Filter(HxH_Hourly, StartsWith(Title, varKey)));
        ClearCollect(colHours,
            ForAll(Sequence(Max(12, RoundUp(varDurM / 60, 0))),
                With({h: Value},
                    With({s: LookUp(colSaved, HourNo = h), sm: Max(0, Min(60, varDurM - (h - 1) * 60))},
                        {HourNo: h,
                         StartT: DateAdd(varStart, (h - 1) * 60, TimeUnit.Minutes),
                         SlotMin: sm,
                         InShift: sm > 0,
                         Job: Coalesce(s.Job, ""),
                         Cum: s.CumulativeUnits,
                         BPM: s.SpeedBPM,
                         Planned: Coalesce(s.PlannedMin, 0),
                         Tgt: If(sm > 0, Max(0, varUPH * (sm - Coalesce(s.PlannedMin, 0)) / 60), 0),
                         DT: s.DT_Minutes,
                         Reason: Coalesce(s.DT_Reason, ""),
                         DT2: s.DT2_Minutes,
                         Reason2: Coalesce(s.DT2_Reason, ""),
                         Safety: Coalesce(s.SafetyEvent, false),
                         Notes: Coalesce(s.Notes, "")}))));
        Set(varLoadedAt, Now())
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =1222
      Y: =28
      Width: =130
      Height: =52
      Tooltip: |-
        ="Reload this line / date / shift from SharePoint. Display screens: press to pick up the latest entries."
