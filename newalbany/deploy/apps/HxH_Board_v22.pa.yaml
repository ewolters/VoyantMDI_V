- btnSaveShift:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =With({act: Max(colHours, Coalesce(Cum, 0)), tgt: Sum(colHours, Tgt),
              bpm: If(CountRows(Filter(colHours, Coalesce(BPM, 0) > 0)) = 0, Blank(), Average(Filter(colHours, Coalesce(BPM, 0) > 0), BPM)),
              avail: With({d0: ddDate.Selected.D}, With({d1: If(ddEnd.Selected.M <= ddStart.Selected.M, DateAdd(d0, 1, TimeUnit.Days), d0)}, DateDiff(DateTime(Year(d0), Month(d0), Day(d0), RoundDown(ddStart.Selected.M / 60, 0), Mod(ddStart.Selected.M, 60), 0), DateTime(Year(d1), Month(d1), Day(d1), RoundDown(ddEnd.Selected.M / 60, 0), Mod(ddEnd.Selected.M, 60), 0), TimeUnit.Minutes))) - Coalesce(Value(txtLunch.Text), 0) - Coalesce(Value(txtBreak.Text), 0),
              scrap: Coalesce(Value(txtScrap.Text), 0),
              rep: Sum(colHours, Coalesce(DT, 0) + Coalesce(DT2, 0))},
         With({up: If(Coalesce(bpm, 0) > 0, act / bpm, Blank())},
          With({A: If(avail > 0 && !IsBlank(up), up / avail, Blank()),
                P: If(varTmax > 0 && Coalesce(bpm, 0) > 0, bpm / varTmax, Blank()),
                Q: If(act > 0, 1 - scrap / act, Blank())},
           IfError(Patch(HxH_Shift,
            Coalesce(LookUp(HxH_Shift, Title = ddLine.Selected.Value & "-" & Text(ddDate.Selected.D, "yyyymmdd") & "-S" & ddShift.Selected.Value), Defaults(HxH_Shift)),
            {Title: ddLine.Selected.Value & "-" & Text(ddDate.Selected.D, "yyyymmdd") & "-S" & ddShift.Selected.Value, Line: ddLine.Selected.Value, ShiftDate: ddDate.Selected.D, Shift: Value(ddShift.Selected.Value),
             ProductForm: If(varProd = "— PICK PRODUCT —", "", varProd),
             PlaybookKey: If(varProd = "— PICK PRODUCT —", "", ddLine.Selected.Value & "|" & varPB.Size & "|" & varPB.Form),
             Job1: txtJob1.Text,
             Job2: Coalesce(Last(Filter(colHours, !IsBlank(Job) && Job <> txtJob1.Text)).Job, ""),
             PlannedShiftHrs: With({d0: ddDate.Selected.D}, With({d1: If(ddEnd.Selected.M <= ddStart.Selected.M, DateAdd(d0, 1, TimeUnit.Days), d0)}, DateDiff(DateTime(Year(d0), Month(d0), Day(d0), RoundDown(ddStart.Selected.M / 60, 0), Mod(ddStart.Selected.M, 60), 0), DateTime(Year(d1), Month(d1), Day(d1), RoundDown(ddEnd.Selected.M / 60, 0), Mod(ddEnd.Selected.M, 60), 0), TimeUnit.Minutes))) / 60,
             ActualStartTime: ddStart.Selected.Value, ActualEndTime: ddEnd.Selected.Value,
             LunchMin: Coalesce(Value(txtLunch.Text), 0), BreakMin: Coalesce(Value(txtBreak.Text), 0),
             TargetUnits: tgt, ActualUnits: act, AvgBPM: bpm, TmaxBPM: varTmax,
             ReportedDowntimeMin: rep, CalculatedDowntimeMin: If(IsBlank(up), Blank(), avail - up), MachineUptimeMin: up,
             Availability: A, Performance: P, FGScrapQty: scrap, Quality: Q, OEE: If(IsBlank(A) || IsBlank(P) || IsBlank(Q), Blank(), A * P * Q),
             ScrapReasonCode: ddScrapReason.Selected.Value, ScrapNotes: txtScrapNotes.Text,
             StdCrewSize: Value(varPB.'Total HC'), ActualCrewSize: Value(txtCrew.Text),
             StaffingReasonCode: ddStaff.Selected.Value, SpeedLossReasonCode: ddSpeedLoss.Selected.Value,
             EnteredBy: User().Email}), Notify("Shift totals not saved yet (no connection?). They update on the next save.", NotificationType.Warning), true))));
        Set(varSavedAt, Now())
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
