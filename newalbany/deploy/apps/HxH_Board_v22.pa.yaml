- btnSaveRow:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =Select(btnFlush);
        If(IsBlank(varPB), Select(btnRefresh));
        With({r: varRow, k: ddLine.Selected.Value & "-" & Text(ddDate.Selected.D, "yyyymmdd") & "-S" & ddShift.Selected.Value & "-H" & Text(varRow.HourNo, "00")},
         With({cumT: Sum(Filter(colHours, HourNo <= r.HourNo), Tgt), prev: Coalesce(LookUp(colHours, HourNo = r.HourNo - 1).Cum, 0),
               c1: If(IsBlank(r.Reason), 0, Sum(Filter(colHours, Reason = r.Reason), Coalesce(DT, 0)) + Sum(Filter(colHours, Reason2 = r.Reason), Coalesce(DT2, 0))),
               c2: If(IsBlank(r.Reason2), 0, Sum(Filter(colHours, Reason = r.Reason2), Coalesce(DT, 0)) + Sum(Filter(colHours, Reason2 = r.Reason2), Coalesce(DT2, 0)))},
          With({rec: {Title: k, Line: ddLine.Selected.Value, ShiftDate: ddDate.Selected.D, Shift: Value(ddShift.Selected.Value),
            HourNo: r.HourNo, HourStart: r.StartT, SlotMin: r.SlotMin,
            ProductForm: If(varProd = "— PICK PRODUCT —", "", varPB.Size & " " & varPB.Form),
            PlaybookKey: If(varProd = "— PICK PRODUCT —", "", ddLine.Selected.Value & "|" & varPB.Size & "|" & varPB.Form),
            Job: If(IsBlank(r.Job), txtJob1.Text, r.Job),
            HourlyTarget: r.Tgt, CumTarget: cumT, CumulativeUnits: r.Cum,
            HourlyActual: If(IsBlank(r.Cum), Blank(), r.Cum - prev),
            RunRatePct: If(IsBlank(r.Cum) || r.Tgt = 0, Blank(), (r.Cum - prev) / r.Tgt),
            SpeedBPM: r.BPM, PlannedMin: r.Planned,
            DT_Minutes: r.DT, DT_Reason: r.Reason, DT2_Minutes: r.DT2, DT2_Reason: r.Reason2,
            SafetyEvent: r.Safety, Notes: r.Notes, EnteredBy: User().Email,
            ShiftKey: ddLine.Selected.Value & "-" & Text(ddDate.Selected.D, "yyyymmdd") & "-S" & ddShift.Selected.Value,
            EscReason: If(c2 > c1, r.Reason2, r.Reason), EscCumMin: Max(c1, c2)}},
           IfError(Patch(HxH_Hourly, Coalesce(LookUp(HxH_Hourly, Title = k), Defaults(HxH_Hourly)), rec),
            RemoveIf(colPending, K = k); Collect(colPending, {K: k, HourNo: r.HourNo, Rec: rec, At: Now()});
            Notify("Hour " & r.HourNo & " NOT saved (no connection?). It is kept on this tablet and will retry. Keep this app open.", NotificationType.Warning),
            RemoveIf(colPending, K = k)))));
        If(CountRows(colPending) = 0, Set(varSavedAt, Now()));
        Select(btnSaveShift)
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 0, 0, 0)
