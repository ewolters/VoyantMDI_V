- btnFCalc:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =Set(varFBusy, true); Set(varFSel, false);
        ClearCollect(colFS, AddColumns(Filter(colFShiftAll, (ddFShift.Selected.Value = "All" || Text(Shift) = ddFShift.Selected.Value)), Fm, If(IsBlank(PlaybookKey), "(no product)", Last(Split(PlaybookKey, "|")).Value)));
        ClearCollect(colFForms, Sort(Distinct(colFS, Fm), If(Value = "(no product)", "zzz", Value)));
        ClearCollect(colFDay, Ungroup(ForAll(colFForms As ff, {rows: ForAll(Sequence(7, 0) As k,
          With({dD: DateAdd(varF0, k.Value, TimeUnit.Days), F: ff.Value},
          With({dE: DateAdd(dD, 1, TimeUnit.Days)},
           With({shs: Filter(colFS, Fm = F && ShiftDate >= dD && ShiftDate < dE)},
            With({qas: Filter(colFQA, ShiftKey in shs.Title), dth: Filter(colFDTH, ShiftKey in shs.Title)},
             With({t: Coalesce(Sum(shs, Coalesce(TargetUnits, 0)), 0), a: Coalesce(Sum(shs, Coalesce(ActualUnits, 0)), 0), o: Coalesce(Sum(shs, Coalesce(OEE, 0) * Coalesce(TargetUnits, 0)), 0),
                   sh: CountRows(shs), sc: Coalesce(Sum(shs, Coalesce(FGScrapQty, 0)), 0), ca: Coalesce(Sum(shs, Coalesce(ActualCrewSize, 0)), 0), cs: Coalesce(Sum(shs, Coalesce(StdCrewSize, 0)), 0),
                   dt: Coalesce(Sum(shs, Coalesce(ReportedDowntimeMin, 0)), 0), rw: Coalesce(Sum(qas, Coalesce(ReworkQty, 0)), 0),
                   pt: Coalesce(Sum(shs, With({pb: LookUp(colPB, Title = PlaybookKey)}, If(IsBlank(pb), Coalesce(TargetUnits, 0), Coalesce(Value(Text(pb.UnitsPerHour)), 0) * Max(Coalesce(PlannedShiftHrs, pb.AvailableHrsShift, 0) - (Coalesce(LunchMin, 0) + Coalesce(BreakMin, 0)) / 60, 0)))), 0),
                   effw: Coalesce(Sum(shs, Coalesce(LookUp(colPB, Title = PlaybookKey).EfficiencyTarget, 0) * Coalesce(TargetUnits, 0)), 0),
                   escl: 0,
                   evs: GroupBy(Filter(Ungroup(Table({t: ForAll(dth, {K: ShiftKey & "|" & DT_Reason, R: DT_Reason, M: Coalesce(DT_Minutes, 0)})}, {t: ForAll(dth, {K: ShiftKey & "|" & DT2_Reason, R: DT2_Reason, M: Coalesce(DT2_Minutes, 0)})}), t), M > 0 && !IsBlank(R)), K, R, G)},
              With({dte: CountRows(evs), dtl: Coalesce(Max(ForAll(evs, {v: Coalesce(Sum(G, M), 0)}), v), 0)},
               {Fm: F, Day: dD, Shifts: sh, Act: a, Plan: pt, DT: dt,
                Lines: Concat(Sort(Distinct(shs, Line), Value), Value, "  "),
                txtD: If(pt = 0, "—", Text(a / pt * 100, "0") & "%"), subD: If(pt = 0, "no board data", Text(a, "#,##0") & " / " & Text(pt, "#,##0")), stD: If(pt = 0, "N", a / pt * 100 >= varAG, "G", a / pt * 100 >= varAA, "A", "R"),
                txtDT: If(sh = 0, "—", Text(dt) & " min"), subDT: If(sh = 0, "", dte = 0, "no events", Text(dte) & If(dte = 1, " event", " events") & " · max " & Text(dtl) & "m" & If(escl > 0, " · L" & escl, "")), stDT: If(sh = 0, "N", escl > 0 || dt / sh >= varDR, "R", dt / sh >= varDA, "A", "G"),
                txtC: If(t = 0, "—", Text(o / t * 100, "0") & "%"), subC: If(t = 0, "", Text(sc, "#,##0") & " units scrapped"), stC: If(t = 0, "N", o / t >= If(t = 0 || effw = 0, varOG / 100, effw / t), "G", o / t >= If(t = 0 || effw = 0, varOG / 100, effw / t) - (varOG - varOA) / 100, "A", "R"),
                txtQ: If(a = 0, "—", Text(rw / a * 100, "0.0") & "%"), subQ: Text(rw, "#,##0") & " rework · " & Text(sc, "#,##0") & " scrap", stQ: If(a = 0, "N", rw / a * 100 >= varRR, "R", rw / a * 100 >= varRA, "A", "G"),
                txtP: If(cs = 0, "—", Text(ca) & " / " & Text(cs)), subP: If(cs = 0, "", ca > cs, "+" & Text(ca - cs) & " over std", ca < cs, Text(cs - ca) & " short", "on standard"), stP: If(cs = 0, "N", ca < cs, "R", ca > cs, "A", "G")})))))))}), rows));
        ClearCollect(colFRows, ForAll(colFForms As ff, With({x: LookUp(colFDay, Fm = ff.Value && Day = varFD)},
          {Fm: ff.Value, Lines: x.Lines, Shifts: x.Shifts, Tr: Concat(Sort(Filter(colFDay, Fm = ff.Value), Day), stD),
           txtD: x.txtD, subD: x.subD, stD: x.stD,
           txtDT: x.txtDT, subDT: x.subDT, stDT: x.stDT,
           txtC: x.txtC, subC: x.subC, stC: x.stC,
           txtQ: x.txtQ, subQ: x.subQ, stQ: x.stQ,
           txtP: x.txtP, subP: x.subP, stP: x.stP})));
        Set(varFBusy, false)
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 0, 0, 0)
      Color: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(0, 178, 169, 0.08)
      BorderColor: =RGBA(0, 0, 0, 0)
      RadiusTopLeft: =0
      RadiusTopRight: =0
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      PressedFill: =RGBA(0, 178, 169, 0.15)
      TabIndex: =-1
      X: =0
      Y: =1079
      Width: =1
      Height: =1
- btnFOpen:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =ClearCollect(colFDet, ForAll(SortByColumns(Filter(colFS, Fm = varFForm && ShiftDate >= varFD && ShiftDate < DateAdd(varFD, 1, TimeUnit.Days)), "Line", SortOrder.Ascending, "Shift", SortOrder.Ascending) As s,
          With({pb: LookUp(colPB, Title = s.PlaybookKey), hrs: Filter(colFDTH, ShiftKey = s.Title)},
          With({pt: If(IsBlank(pb), Coalesce(s.TargetUnits, 0), Coalesce(Value(Text(pb.UnitsPerHour)), 0) * Max(Coalesce(s.PlannedShiftHrs, pb.AvailableHrsShift, 0) - (Coalesce(s.LunchMin, 0) + Coalesce(s.BreakMin, 0)) / 60, 0)),
                a: Coalesce(s.ActualUnits, 0),
                rs: GroupBy(Filter(Ungroup(Table({t: ForAll(hrs, {R: DT_Reason, M: Coalesce(DT_Minutes, 0)})}, {t: ForAll(hrs, {R: DT2_Reason, M: Coalesce(DT2_Minutes, 0)})}), t), M > 0 && !IsBlank(R)), R, G)},
           With({top: First(SortByColumns(ForAll(rs, {Rn: R, Mn: Coalesce(Sum(G, M), 0)}), "Mn", SortOrder.Descending))},
            {Line: s.Line, Shift: s.Shift, Prod: Coalesce(s.ProductForm, "no product picked"), Act: a, Plan: pt,
             Att: If(pt = 0, "—", Text(a / pt * 100, "0") & "%"), AttSt: If(pt = 0, "N", a / pt * 100 >= varAG, "G", a / pt * 100 >= varAA, "A", "R"),
             DT: Coalesce(s.ReportedDowntimeMin, 0), Top: If(IsBlank(top), "—", top.Rn & "  (" & Text(top.Mn) & " min)"),
             OEEt: If(IsBlank(s.OEE), "—", Text(s.OEE * 100, "0") & "%"),
             Crew: If(Coalesce(s.StdCrewSize, 0) = 0, Text(Coalesce(s.ActualCrewSize, 0)), Text(Coalesce(s.ActualCrewSize, 0)) & " / " & Text(s.StdCrewSize))})))));
        Set(varFSel, true)
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 0, 0, 0)
      Color: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(0, 178, 169, 0.08)
      BorderColor: =RGBA(0, 0, 0, 0)
      RadiusTopLeft: =0
      RadiusTopRight: =0
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      PressedFill: =RGBA(0, 178, 169, 0.15)
      TabIndex: =-1
      X: =2
      Y: =1079
      Width: =1
      Height: =1
