- btnFLoad:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(varFBusy, "LOADING…", "REFRESH")
      OnSelect: |-
        =Set(varFBusy, true); Set(varFSel, false);
        Set(varFD, ddFDate.Selected.D); Set(varF0, DateAdd(varFD, -6, TimeUnit.Days)); Set(varF1, DateAdd(varFD, 1, TimeUnit.Days));
        IfError(ClearCollect(colCfg, MDI_Config), Notify("By form: could not load MDI_Config", NotificationType.Error), true);
        Set(varAG, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainGreen").SettingValue, "90")));
        Set(varAA, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainAmber").SettingValue, "80")));
        Set(varOG, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEGreen").SettingValue, "65")));
        Set(varOA, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEAmber").SettingValue, "50")));
        Set(varRA, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkAmber").SettingValue, "0.5")));
        Set(varRR, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkRed").SettingValue, "2")));
        Set(varDA, Value(Coalesce(LookUp(colCfg, Title = "T2_DTAmber").SettingValue, "30")));
        Set(varDR, Value(Coalesce(LookUp(colCfg, Title = "T2_DTRed").SettingValue, "60")));
        IfError(ClearCollect(colPB, PLAYBOOK), Notify("By form: could not load PLAYBOOK", NotificationType.Error), true);
        IfError(ClearCollect(colFShiftAll, Filter(HxH_Shift, ShiftDate >= varF0 && ShiftDate < varF1)), Notify("By form: could not load HxH_Shift", NotificationType.Error), true);
        IfError(ClearCollect(colFDTH, Filter(HxH_Hourly, ShiftDate >= varF0 && ShiftDate < varF1 && (DT_Minutes > 0 || DT2_Minutes > 0))), Notify("By form: could not load HxH_Hourly (downtime)", NotificationType.Error), true);
        IfError(ClearCollect(colFQA, Filter(QA_Rework, ShiftDate >= varF0 && ShiftDate < varF1 && Voided = false)), Notify("By form: could not load QA_Rework", NotificationType.Error), true);
        Set(varFLoadedAt, Now()); Set(varFBusy, false);
        Select(btnFCalc)
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 178, 169, 1)
      Color: =RGBA(7, 39, 45, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Tooltip: ="Load the day reviewed and the 6 days before it"
      X: =710
      Y: =28
      Width: =140
      Height: =52
