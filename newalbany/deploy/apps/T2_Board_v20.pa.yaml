- btnRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="REFRESH"
      OnSelect: |-
        =Set(varD, ddDate.Selected.D); Set(varD0, DateAdd(varD, -6, TimeUnit.Days)); Set(varD1, DateAdd(varD, 1, TimeUnit.Days));
        If(IsBlank(varLayer), Set(varLayer, "floor"));
        IfError(ClearCollect(colCfg, MDI_Config), Notify("Tier 2: could not load MDI_Config", NotificationType.Error), true);
        Set(varAG, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainGreen").SettingValue, "90")));
        Set(varAA, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainAmber").SettingValue, "80")));
        Set(varOG, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEGreen").SettingValue, "65")));
        Set(varOA, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEAmber").SettingValue, "50")));
        Set(varRA, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkAmber").SettingValue, "0.5")));
        Set(varRR, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkRed").SettingValue, "2")));
        Set(varPCG, Value(Coalesce(LookUp(colCfg, Title = "T2_PCGreen").SettingValue, "90")));
        Set(varDA, Value(Coalesce(LookUp(colCfg, Title = "T2_DTAmber").SettingValue, "30")));
        Set(varDR, Value(Coalesce(LookUp(colCfg, Title = "T2_DTRed").SettingValue, "60")));
        Set(varTSReq, Value(Coalesce(LookUp(colCfg, Title = "T2_TSRequiredMin").SettingValue, "15")));
        IfError(ClearCollect(colLines, Sort(Filter(Lines, Active), DisplayOrder)), Notify("Tier 2: could not load Lines", NotificationType.Error), true);
        IfError(ClearCollect(colPB, PLAYBOOK), Notify("Tier 2: could not load PLAYBOOK", NotificationType.Error), true);
        IfError(ClearCollect(colMR, Filter(Lookups, Category.Value = "Downtime")), Notify("Tier 2: could not load Lookups (downtime reasons)", NotificationType.Error), true);
        RemoveIf(colMR, IsBlank(EquipType));
        Set(varCanLink, Coalesce(LookUp(People, Email = User().Email).CanLinkDowntime, false));
        IfError(ClearCollect(colShift, Filter(HxH_Shift, ShiftDate >= varD0 && ShiftDate < varD1)), Notify("Tier 2: could not load HxH_Shift", NotificationType.Error), true);
        IfError(ClearCollect(colHrDay, Filter(HxH_Hourly, ShiftDate >= varD && ShiftDate < varD1)), Notify("Tier 2: could not load HxH_Hourly (day)", NotificationType.Error), true);
        IfError(ClearCollect(colDTH, Filter(HxH_Hourly, ShiftDate >= varD0 && ShiftDate < varD1 && (DT_Minutes > 0 || DT2_Minutes > 0))), Notify("Tier 2: could not load HxH_Hourly (downtime)", NotificationType.Error), true);
        IfError(ClearCollect(colSafe, Filter(HxH_Hourly, ShiftDate >= varD0 && ShiftDate < varD1 && SafetyEvent = true)), Notify("Tier 2: could not load HxH_Hourly (safety)", NotificationType.Error), true);
        IfError(ClearCollect(colFA, Filter(SAF_Audits, AuditDate >= varD0 && AuditDate < varD1)), Notify("Tier 2: could not load SAF_Audits (safety audits)", NotificationType.Error), true);
        IfError(ClearCollect(colFR, Filter(SAF_Results, AuditDate >= varD0 && AuditDate < varD1)), Notify("Tier 2: could not load SAF_Results (safety audits)", NotificationType.Error), true);
        RemoveIf(colFR, !(Rating.Value = "AR" || Rating.Value = "U" || (Rating.Value = "Deficient" && SafetyRelevant)));
        IfError(ClearCollect(colQA, Filter(QA_Rework, ShiftDate >= varD0 && ShiftDate < varD1 && Voided = false)), Notify("Tier 2: could not load QA_Rework", NotificationType.Error), true);
        IfError(ClearCollect(colTSAll, Filter(TS_Occurrences, ShiftDate >= varD0 && ShiftDate < varD1)), Notify("Tier 2: could not load TS_Occurrences", NotificationType.Error), true);
        ClearCollect(colTS, Filter(colTSAll, LinkStatus.Value <> "Waived")); ClearCollect(colWv, Filter(colTSAll, LinkStatus.Value = "Waived"));
        IfError(ClearCollect(colIss, TS_Issues), Notify("Tier 2: could not load TS_Issues", NotificationType.Error), true);
        IfError(ClearCollect(colFix, TS_Fixes), Notify("Tier 2: could not load TS_Fixes", NotificationType.Error), true);
        IfError(ClearCollect(colPC, Filter(PC_Audits, ShiftDate >= varD0 && ShiftDate < varD1)), Notify("Tier 2: could not load PC_Audits", NotificationType.Error), true);
        IfError(ClearCollect(colRes, Filter(PC_Results, Created >= varD0 && Created < varD1)), Notify("Tier 2: could not load PC_Results", NotificationType.Error), true);
        IfError(ClearCollect(colEl, SW_Elements), Notify("Tier 2: could not load SW_Elements", NotificationType.Error), true);
        IfError(ClearCollect(colCards, Filter(PC_Cards, Active = true)), Notify("Tier 2: could not load PC_Cards", NotificationType.Error), true);
        IfError(ClearCollect(colEsc, Filter(Escalation_Log, NotifiedAt >= DateAdd(varD0, -1, TimeUnit.Days) && NotifiedAt < DateAdd(varD1, 1, TimeUnit.Days))), Notify("Tier 2: could not load Escalation_Log", NotificationType.Error), true);
        IfError(ClearCollect(colNews, Filter(Newspaper, Status.Value = "Open" || Status.Value = "In progress" || ClosedDate >= varD0)), Notify("Tier 2: could not load Newspaper", NotificationType.Error), true);
        Set(varLoadedAt, Now());
        Select(btnCalc)
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 178, 169, 1)
      Color: =RGBA(7, 39, 45, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =1170
      Y: =28
      Width: =130
      Height: =52
