- btnQSave:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(!IsBlank(ddQProd.Selected.Value) && !IsBlank(txtQJob.Text) && !IsBlank(varReason) && Coalesce(Value(txtQQty.Text), 0) > 0, "SAVE REWORK", "PICK PRODUCT · JOB · REASON · UNITS")
      OnSelect: |-
        =IfError(
         Patch(QA_Rework, Defaults(QA_Rework),
         {Ref: ddQLine.Selected.Value & "-" & Text(ddQDate.Selected.D, "yyyymmdd") & "-S" & ddQShift.Selected.Value & "-" & Text(Now(), "hhmmss"),
          Line: ddQLine.Selected.Value, ShiftDate: ddQDate.Selected.D, Shift: Value(ddQShift.Selected.Value),
          ShiftKey: ddQLine.Selected.Value & "-" & Text(ddQDate.Selected.D, "yyyymmdd") & "-S" & ddQShift.Selected.Value,
          Size: ddQProd.Selected.Size, Form: ddQProd.Selected.Form, ProductForm: ddQProd.Selected.Size & " " & ddQProd.Selected.Form,
          PlaybookKey: ddQLine.Selected.Value & "|" & ddQProd.Selected.Size & "|" & ddQProd.Selected.Form,
          Job: txtQJob.Text, Reason: varReason, ReworkQty: Value(txtQQty.Text), Notes: txtQNotes.Text, EnteredBy: User().Email}),
         Notify("NOT SAVED — " & FirstError.Message & "  (check connection, try again)", NotificationType.Error),
         Notify(Text(Value(txtQQty.Text)) & " units logged — " & varReason, NotificationType.Success);
         Reset(txtQQty); Reset(txtQNotes); Set(varReason, Blank());
         Select(btnQRefresh))
      Font: =Font.Arial
      Size: =16
      FontWeight: =FontWeight.Bold
      Fill: =If(!IsBlank(ddQProd.Selected.Value) && !IsBlank(txtQJob.Text) && !IsBlank(varReason) && Coalesce(Value(txtQQty.Text), 0) > 0, RGBA(0, 72, 81, 1), RGBA(217, 217, 214, 1))
      Color: =If(!IsBlank(ddQProd.Selected.Value) && !IsBlank(txtQJob.Text) && !IsBlank(varReason) && Coalesce(Value(txtQQty.Text), 0) > 0, RGBA(255, 255, 255, 1), RGBA(117, 120, 123, 1))
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      DisplayMode: =If(!IsBlank(ddQProd.Selected.Value) && !IsBlank(txtQJob.Text) && !IsBlank(varReason) && Coalesce(Value(txtQQty.Text), 0) > 0, DisplayMode.Edit, DisplayMode.Disabled)
      DisabledFill: =RGBA(217, 217, 214, 1)
      DisabledColor: =RGBA(117, 120, 123, 1)
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =28
      Y: =656
      Width: =668
      Height: =64
      Tooltip: ="Saves one rework entry. Log each reason separately."
