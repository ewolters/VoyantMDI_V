- btnPRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="↻"
      OnSelect: |-
        =IfError(ClearCollect(colCards, Filter(PC_Cards, Active = true)), Notify("Could not load PC_Cards — " & FirstError.Message, NotificationType.Error), true);
        ClearCollect(colLines, Lines);
        IfError(ClearCollect(colDone, Filter(PC_Audits, ShiftDate >= DateAdd(Today(), -8, TimeUnit.Days))), Notify("Could not load PC_Audits", NotificationType.Warning), true);
        If(!varParamUsed && !IsBlank(Param("card")), Set(varCardID, Value(Param("card"))); Select(btnPStart));
        Set(varParamUsed, true);
        If(IsBlank(varStep), Set(varStep, "pick"));
        Set(varLoaded, Now())
      Font: =Font.Arial
      Size: =16
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      X: =570
      Y: =72
      Width: =54
      Height: =38
