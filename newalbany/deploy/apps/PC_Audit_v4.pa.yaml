- galCards:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: |-
        =SortByColumns(ForAll(Filter(colCards, ddPLine.Selected.Value = "All" || Line = "All" || IsBlank(Line) || Line = ddPLine.Selected.Value) As c,
         {ID: c.ID, Card: c.Card, Tier: c.Tier, Freq: c.Frequency.Value, Line: c.Line, Area: c.Area,
          DoneNow: CountRows(Filter(colDone, CardID = c.ID && ShiftKey = ddPLine.Selected.Value & "-" & Text(If(Hour(Now()) < 6, DateAdd(Today(), -1, TimeUnit.Days), Today()), "yyyymmdd") & "-S" & Text(If(Hour(Now()) * 60 + Minute(Now()) >= 360 && Hour(Now()) * 60 + Minute(Now()) < 990, 1, 2)))) > 0}), "DoneNow", SortOrder.Ascending, "Tier", SortOrder.Ascending)
      TemplateSize: =120
      TemplatePadding: =0
      X: =10
      Y: =188
      Width: =620
      Height: =900
      Visible: =varStep = "pick"
    Children:
      - gKBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            X: =0
            Y: =0
            Width: =620
            Height: =112
            BorderColor: =RGBA(217, 217, 214, 1)
            BorderThickness: =1
      - gKTab:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(ThisItem.DoneNow, RGBA(46, 160, 67, 1), RGBA(207, 34, 46, 1))
            X: =0
            Y: =0
            Width: =14
            Height: =112
      - gKName:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Card
            Font: =Font.Arial
            Size: =15
            Color: =RGBA(7, 39, 45, 1)
            FontWeight: =FontWeight.Bold
            X: =26
            Y: =6
            Width: =440
            Height: =52
      - gKSub:
          Control: Label@2.5.1
          Properties:
            Text: ="Tier " & ThisItem.Tier & "  ·  " & ThisItem.Freq & "  ·  " & Coalesce(ThisItem.Line, "") & If(IsBlank(ThisItem.Area), "", " · " & ThisItem.Area)
            Font: =Font.Arial
            Size: =11
            Color: =RGBA(117, 120, 123, 1)
            X: =26
            Y: =58
            Width: =440
            Height: =40
      - gKState:
          Control: Label@2.5.1
          Properties:
            Text: =If(ThisItem.DoneNow, "DONE ✓", "DUE")
            Font: =Font.Arial
            Size: =14
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =If(ThisItem.DoneNow, RGBA(46, 160, 67, 1), RGBA(207, 34, 46, 1))
            X: =480
            Y: =30
            Width: =120
            Height: =44
      - gKSel:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            OnSelect: =Set(varCardID, ThisItem.ID); Select(btnPStart)
            Font: =Font.Arial
            Size: =12
            FontWeight: =FontWeight.Bold
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 72, 81, 0.06)
            BorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 72, 81, 0.12)
            X: =0
            Y: =0
            Width: =620
            Height: =112
