- btnSubmit:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(CountRows(Filter(colAns, IsBlank(Answer) || (Answer = "No" && IsBlank(Missed)))) = 0, "SUBMIT CARD", "ANSWER EVERY ITEM")
      OnSelect: |-
        =IfError(
         Set(varAud, Patch(PC_Audits, Defaults(PC_Audits), {
           Ref: "PC" & varCardID & "-" & Text(Now(), "yyyymmdd-hhmmss"), CardID: varCardID, StandardID: LookUp(colCards, ID = varCardID).StandardID,
           Line: If(ddPLine.Selected.Value = "All", LookUp(colCards, ID = varCardID).Line, ddPLine.Selected.Value), Area: LookUp(colCards, ID = varCardID).Area,
           ShiftDate: If(Hour(Now()) < 6, DateAdd(Today(), -1, TimeUnit.Days), Today()), Shift: If(Hour(Now()) * 60 + Minute(Now()) >= 360 && Hour(Now()) * 60 + Minute(Now()) < 990, 1, 2), ShiftKey: ddPLine.Selected.Value & "-" & Text(If(Hour(Now()) < 6, DateAdd(Today(), -1, TimeUnit.Days), Today()), "yyyymmdd") & "-S" & Text(If(Hour(Now()) * 60 + Minute(Now()) >= 360 && Hour(Now()) * 60 + Minute(Now()) < 990, 1, 2)), Tier: LookUp(colCards, ID = varCardID).Tier,
           AuditedBy: User().Email, AuditorName: User().FullName, Observed: txtObs.Text, StartedAt: varStart, CompletedAt: Now(),
           Result: {Value: If(CountRows(Filter(colAns, Answer = "No")) = 0, "Pass", "Fail")}, Score: If(CountRows(Filter(colAns, Answer = "Yes")) + CountRows(Filter(colAns, Answer = "No")) = 0, 1, CountRows(Filter(colAns, Answer = "Yes")) / (CountRows(Filter(colAns, Answer = "Yes")) + CountRows(Filter(colAns, Answer = "No")))), NYes: CountRows(Filter(colAns, Answer = "Yes")), NNo: CountRows(Filter(colAns, Answer = "No")), NNA: CountRows(Filter(colAns, Answer = "N/A")), Notes: txtPNotes.Text}));
         ForAll(colAns As a, Patch(PC_Results, Defaults(PC_Results), {Ref: varAud.Ref & "-I" & a.ItemNo, AuditID: varAud.ID, CardID: varCardID, ItemNo: a.ItemNo, ElementID: a.ElementID,
           Answer: {Value: a.Answer}, Missed: a.Missed, ActionCreated: a.Answer = "No" && a.Act, NewspaperRef: If(a.Answer = "No" && a.Act, varAud.Ref & "-I" & a.ItemNo, ""), Line: varAud.Line, ShiftKey: varAud.ShiftKey}));
         ForAll(Filter(colAns, Answer = "No" && Act) As a, Patch(Newspaper, Defaults(Newspaper), {
           Action: Left("PC: " & LookUp(colItems, ItemNo = a.ItemNo).Section & " — " & a.Missed, 250), Line: varAud.Line,
           SQDCP: {Value: If(LookUp(colItems, ItemNo = a.ItemNo).PType = "Safety", "Safety", "Quality")}, Source: {Value: "Process confirmation"},
           Problem: "Process confirmation " & LookUp(colCards, ID = varCardID).Card & ", item " & a.ItemNo & ": " & a.Missed, RaisedDate: Today(), DueDate: DateAdd(Today(), 7, TimeUnit.Days),
           Status: {Value: "Open"}, RefKey: varAud.Ref & "-I" & a.ItemNo}));
         ForAll(colPhotos As p, Patch(TS_Photos, LookUp(TS_Photos, ID = Value('MDI-UploadPhoto'.Run(JSON(p.Ph, JSONFormat.IncludeBinaryData), varAud.Ref & "-I" & p.ItemNo & ".jpg",
            varAud.ID, p.ItemNo, 0, If(LookUp(colAns, ItemNo = p.ItemNo).Answer = "No", "Finding", "Step"), LookUp(colAns, ItemNo = p.ItemNo).Missed, User().Email).photoid)),
            {Module: {Value: "Process confirmation"}, RefID: varAud.ID})),
         Notify("NOT SUBMITTED — " & FirstError.Message & "  (check signal, try again)", NotificationType.Error),
         Set(varResult, If(CountRows(Filter(colAns, Answer = "No")) = 0, "Pass", "Fail")); Set(varStep, "done"); Reset(txtObs); Reset(txtPNotes); Select(btnPRefresh))
      Font: =Font.Arial
      Size: =20
      FontWeight: =FontWeight.Bold
      Fill: =If(CountRows(Filter(colAns, IsBlank(Answer) || (Answer = "No" && IsBlank(Missed)))) = 0, RGBA(0, 72, 81, 1), RGBA(217, 217, 214, 1))
      Color: =If(CountRows(Filter(colAns, IsBlank(Answer) || (Answer = "No" && IsBlank(Missed)))) = 0, RGBA(255, 255, 255, 1), RGBA(117, 120, 123, 1))
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      DisplayMode: =If(CountRows(Filter(colAns, IsBlank(Answer) || (Answer = "No" && IsBlank(Missed)))) = 0, DisplayMode.Edit, DisplayMode.Disabled)
      DisabledFill: =RGBA(217, 217, 214, 1)
      DisabledColor: =RGBA(117, 120, 123, 1)
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      X: =16
      Y: =880
      Width: =608
      Height: =80
      Visible: =varStep = "review"
