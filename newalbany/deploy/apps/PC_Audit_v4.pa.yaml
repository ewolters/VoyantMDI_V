        ClearCollect(colRefPh, Filter(TS_Photos, Module.Value = "Standard work" && RefID = varCard.StandardID));
        ClearCollect(colAns, ForAll(colItems, {ItemNo: ItemNo, ElementID: ElementID, Answer: "", Missed: "", Act: true}));
        Clear(colPhotos); Set(varItem, 1); Set(varStart, Now());
        If(CountRows(colItems) = 0, Notify("This card has no items yet — build it in the Standard Work app.", NotificationType.Warning), Set(varStep, "audit"))
