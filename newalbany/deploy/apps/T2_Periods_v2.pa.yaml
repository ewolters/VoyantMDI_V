- galPGrid:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: =SortByColumns(colPGrid, "R", SortOrder.Ascending)
      TemplateSize: =62
      TemplatePadding: =0
      ShowScrollbar: =true
      BorderThickness: =0
      X: =12
      Y: =190
      Width: =1896
      Height: =If(varPSel, 430, 884)
    Children:
      - pcLBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(ThisItem.LSt = "T", RGBA(0, 72, 81, 1), RGBA(7, 39, 45, 1))
            X: =0
            Y: =2
            Width: =varPCW - 2
            Height: =58
      - pcL:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Line
            Font: =Font.Arial
            Size: =If(varPNP > 13, 12, 15)
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =2
            Y: =4
            Width: =varPCW - 6
            Height: =32
            Wrap: =false
      - pcLs:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.VS
            Font: =Font.Arial
            Size: =8
            Color: =RGBA(176, 227, 228, 1)
            Align: =Align.Center
            X: =2
            Y: =34
            Width: =varPCW - 6
            Height: =24
            Visible: =!(varPNP > 13)
      - pc0Bg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Switch(ThisItem.C0.St, "G", RGBA(46, 160, 67, 1), "A", RGBA(210, 153, 34, 1), "R", RGBA(207, 34, 46, 1), "L", RGBA(7, 39, 45, 1), "T", RGBA(0, 72, 81, 1), RGBA(150, 152, 155, 1))
            Visible: =varPNP > 0
            Tooltip: =ThisItem.C0.Sb
            X: =1 * varPCW
            Y: =2
            Width: =varPCW - 2
            Height: =58
      - pc0Tx:
          Control: Label@2.5.1
          Properties:
            Text: =Coalesce(ThisItem.C0.Tx, "—")
            Font: =Font.Arial
            Size: =If(varPNP > 13, 11, 17)
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =1 * varPCW
            Y: =4
            Width: =varPCW - 2
            Height: =32
            Visible: =varPNP > 0
            Wrap: =false
      - pc0Sb:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.C0.Sb
            Font: =Font.Arial
            Size: =8
            Color: =RGBA(255, 255, 255, 1)
            Align: =Align.Center
            X: =1 * varPCW
            Y: =34
            Width: =varPCW - 2
            Height: =24
            Visible: =varPNP > 0 && !(varPNP > 13)
      - pc0Tap:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            OnSelect: =Set(varPLine, ThisItem.Line); Set(varPN, 0); Select(btnPOpen)
            Font: =Font.Arial
            Size: =12
            FontWeight: =FontWeight.Bold
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 178, 169, 0.08)
            BorderColor: =RGBA(0, 0, 0, 0)
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            PressedFill: =RGBA(0, 178, 169, 0.15)
            TabIndex: =-1
            Tooltip: ="Open " & ThisItem.Line & " day by day"
            Visible: =varPNP > 0 && ThisItem.LSt = "L"
            X: =1 * varPCW
            Y: =2
