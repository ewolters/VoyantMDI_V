- btnPLoad:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(varPBusy, "LOADING…", "LOAD")
      OnSelect: |-
        =Set(varPBusy, true); Set(varPSel, false);
        With({f: ddPFrom.Selected.S, t: ddPTo.Selected.S}, Set(varPF, If(f <= t, f, t)); Set(varPT, If(f <= t, t, f)));
        ClearCollect(colPer, If(varPMode = "M",
          ForAll(Sequence(DateDiff(varPF, varPT, TimeUnit.Months) + 1, 0), With({s: DateAdd(varPF, Value, TimeUnit.Months)}, With({e: DateAdd(s, 1, TimeUnit.Months)},
           {N: Value, S: s, E: If(e > Today(), DateAdd(Today(), 1, TimeUnit.Days), e), Lbl: Upper(Text(s, "mmm yy")), Lbl2: Text(s, "mmmm yyyy"), ToDate: e > Today()}))),
          ForAll(Sequence(RoundDown(DateDiff(varPF, varPT, TimeUnit.Days) / 7, 0) + 1, 0), With({s: DateAdd(varPF, 7 * Value, TimeUnit.Days)}, With({e: DateAdd(s, 7, TimeUnit.Days)},
           {N: Value, S: s, E: If(e > Today(), DateAdd(Today(), 1, TimeUnit.Days), e), Lbl: "WK " & Text(s, "m/d"), Lbl2: "Week of " & Text(s, "mmm d") & " – " & Text(DateAdd(s, 6, TimeUnit.Days), "mmm d"), ToDate: e > Today()})))));
        Set(varP0, First(colPer).S); Set(varP1, Last(colPer).E);
        IfError(ClearCollect(colCfg, MDI_Config), Notify("Trends: could not load MDI_Config", NotificationType.Error), true);
        Set(varAG, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainGreen").SettingValue, "90")));
        Set(varAA, Value(Coalesce(LookUp(colCfg, Title = "T2_AttainAmber").SettingValue, "80")));
        Set(varOG, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEGreen").SettingValue, "65")));
        Set(varOA, Value(Coalesce(LookUp(colCfg, Title = "T2_OEEAmber").SettingValue, "50")));
        Set(varRA, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkAmber").SettingValue, "0.5")));
        Set(varRR, Value(Coalesce(LookUp(colCfg, Title = "T2_ReworkRed").SettingValue, "2")));
        Set(varPCG, Value(Coalesce(LookUp(colCfg, Title = "T2_PCGreen").SettingValue, "90")));
        Set(varDA, Value(Coalesce(LookUp(colCfg, Title = "T2_DTAmber").SettingValue, "30")));
        Set(varDR, Value(Coalesce(LookUp(colCfg, Title = "T2_DTRed").SettingValue, "60")));
        Set(varTSReq, Value(Coalesce(LookUp(colCfg, Title = "T2_TSRequiredMin").SettingValue, "15")));
        IfError(ClearCollect(colLines, Sort(Filter(Lines, Active), DisplayOrder)), Notify("Trends: could not load Lines", NotificationType.Error), true);
        IfError(ClearCollect(colPB, PLAYBOOK), Notify("Trends: could not load PLAYBOOK", NotificationType.Error), true);
        IfError(ClearCollect(colMR, Filter(Lookups, Category.Value = "Downtime")), Notify("Trends: could not load Lookups (downtime reasons)", NotificationType.Error), true);
        RemoveIf(colMR, IsBlank(EquipType));
        IfError(ClearCollect(colCards, Filter(PC_Cards, Active = true)), Notify("Trends: could not load PC_Cards", NotificationType.Error), true);
        Clear(colPShift);
        IfError(ForAll(Sequence(RoundUp(DateDiff(varP0, varP1, TimeUnit.Days) / 7, 0), 0) As w,
         Collect(colPShift, Filter(HxH_Shift, ShiftDate >= DateAdd(varP0, 7 * w.Value, TimeUnit.Days) && ShiftDate < DateAdd(varP0, 7 * w.Value + 7, TimeUnit.Days)))),
         Notify("Trends: could not load HxH_Shift", NotificationType.Error), true);
        Clear(colPDTH);
        IfError(ForAll(Sequence(RoundUp(DateDiff(varP0, varP1, TimeUnit.Days) / 7, 0), 0) As w,
         Collect(colPDTH, Filter(HxH_Hourly, ShiftDate >= DateAdd(varP0, 7 * w.Value, TimeUnit.Days) && ShiftDate < DateAdd(varP0, 7 * w.Value + 7, TimeUnit.Days) && (DT_Minutes > 0 || DT2_Minutes > 0)))),
         Notify("Trends: could not load HxH_Hourly (downtime)", NotificationType.Error), true);
        IfError(ClearCollect(colPSafe, Filter(HxH_Hourly, ShiftDate >= varP0 && ShiftDate < varP1 && SafetyEvent = true)), Notify("Trends: could not load HxH_Hourly (safety)", NotificationType.Error), true);
        IfError(ClearCollect(colPFA, Filter(SAF_Audits, AuditDate >= varP0 && AuditDate < varP1)), Notify("Trends: could not load SAF_Audits", NotificationType.Error), true);
        IfError(ClearCollect(colPFR, Filter(SAF_Results, AuditDate >= varP0 && AuditDate < varP1)), Notify("Trends: could not load SAF_Results", NotificationType.Error), true);
        RemoveIf(colPFR, !(Rating.Value = "AR" || Rating.Value = "U" || (Rating.Value = "Deficient" && SafetyRelevant)));
        Clear(colPQA);
        IfError(ForAll(Sequence(RoundUp(DateDiff(varP0, varP1, TimeUnit.Days) / 7, 0), 0) As w,
         Collect(colPQA, Filter(QA_Rework, ShiftDate >= DateAdd(varP0, 7 * w.Value, TimeUnit.Days) && ShiftDate < DateAdd(varP0, 7 * w.Value + 7, TimeUnit.Days) && Voided = false))),
         Notify("Trends: could not load QA_Rework", NotificationType.Error), true);
        Clear(colPTSAll);
        IfError(ForAll(Sequence(RoundUp(DateDiff(varP0, varP1, TimeUnit.Days) / 7, 0), 0) As w,
         Collect(colPTSAll, Filter(TS_Occurrences, ShiftDate >= DateAdd(varP0, 7 * w.Value, TimeUnit.Days) && ShiftDate < DateAdd(varP0, 7 * w.Value + 7, TimeUnit.Days)))),
         Notify("Trends: could not load TS_Occurrences", NotificationType.Error), true);
        ClearCollect(colPTS, Filter(colPTSAll, LinkStatus.Value <> "Waived")); ClearCollect(colPWv, Filter(colPTSAll, LinkStatus.Value = "Waived"));
        Clear(colPPC);
        IfError(ForAll(Sequence(RoundUp(DateDiff(varP0, varP1, TimeUnit.Days) / 7, 0), 0) As w,
         Collect(colPPC, Filter(PC_Audits, ShiftDate >= DateAdd(varP0, 7 * w.Value, TimeUnit.Days) && ShiftDate < DateAdd(varP0, 7 * w.Value + 7, TimeUnit.Days)))),
         Notify("Trends: could not load PC_Audits", NotificationType.Error), true);
        IfError(ClearCollect(colPEsc, Filter(Escalation_Log, NotifiedAt >= DateAdd(varP0, -1, TimeUnit.Days) && NotifiedAt < DateAdd(varP1, 1, TimeUnit.Days))), Notify("Trends: could not load Escalation_Log", NotificationType.Error), true);
        IfError(ClearCollect(colPNews, Filter(Newspaper, Status.Value = "Open" || Status.Value = "In progress" || ClosedDate >= varP0)), Notify("Trends: could not load Newspaper", NotificationType.Error), true);
        Set(varPLoadedAt, Now()); Set(varPBusy, false);
        Select(btnPCalc)
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 178, 169, 1)
      Color: =RGBA(7, 39, 45, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Tooltip: ="Load the weeks or months picked in FROM and TO. Up to 6 months back; older data is archived."
      X: =1376
      Y: =28
      Width: =130
      Height: =52
