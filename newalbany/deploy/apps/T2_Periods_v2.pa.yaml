- btnPCalc:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =Set(varPBusy, true); Set(varPSel, false);
        ClearCollect(colPScope, Filter(colLines, ddPVS.Selected.Value = "All value streams" || ValueStream = ddPVS.Selected.Value));
        ClearCollect(colPAgg, Ungroup(ForAll(colPScope As ln,
          With({nEv: CountRows(Filter(colCards, Frequency.Value = "Every shift" && (Line = "All" || ln.Title in Split(Line, ",")))),
                nDy: CountRows(Filter(colCards, Frequency.Value = "Daily" && (Line = "All" || ln.Title in Split(Line, ","))))},
           {rows: ForAll(colPer As pp,
           With({dD: pp.S, L: ln.Title},
           With({dE: pp.E, K0: Value(Text(pp.S, "yyyymmdd")), K1: Value(Text(pp.E, "yyyymmdd"))},
            With({shs: Filter(colPShift, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value)),
                   qas: Filter(colPQA, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value)),
                   tss: Filter(colPTS, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value)),
                   pcs: Filter(colPPC, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value)),
                   nws: Filter(colPNews, Line = L && RaisedDate < dE && Status.Value <> "Canceled" && (IsBlank(ClosedDate) || ClosedDate >= dE))},
             With({t: Coalesce(Sum(shs, Coalesce(TargetUnits, 0)), 0), a: Coalesce(Sum(shs, Coalesce(ActualUnits, 0)), 0), o: Coalesce(Sum(shs, Coalesce(OEE, 0) * Coalesce(TargetUnits, 0)), 0),
                   sh: CountRows(shs), sc: Coalesce(Sum(shs, Coalesce(FGScrapQty, 0)), 0), ca: Coalesce(Sum(shs, Coalesce(ActualCrewSize, 0)), 0), cs: Coalesce(Sum(shs, Coalesce(StdCrewSize, 0)), 0),
                   dt: Coalesce(Sum(shs, Coalesce(ReportedDowntimeMin, 0)), 0), rw: Coalesce(Sum(qas, Coalesce(ReworkQty, 0)), 0),
                   pt: Coalesce(Sum(shs, With({pb: LookUp(colPB, Title = PlaybookKey)}, If(IsBlank(pb), Coalesce(TargetUnits, 0), Coalesce(Value(Text(pb.UnitsPerHour)), 0) * Max(Coalesce(PlannedShiftHrs, pb.AvailableHrsShift, 0) - (Coalesce(LunchMin, 0) + Coalesce(BreakMin, 0)) / 60, 0)))), 0),
                   effw: Coalesce(Sum(shs, Coalesce(LookUp(colPB, Title = PlaybookKey).EfficiencyTarget, 0) * Coalesce(TargetUnits, 0)), 0),
                   sf: CountRows(Filter(colPSafe, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value))),
                   fz: CountRows(Filter(colPFR, Line = L && AuditDate >= dD && AuditDate < dE)), fch: CountRows(Filter(colPFR, Line = L && AuditDate >= dD && AuditDate < dE && (Severity.Value = "Critical" || Severity.Value = "High"))),
                   fa: CountRows(Filter(colPFA, Line = L && AuditDate >= dD && AuditDate < dE)),
                   tsn: CountRows(tss), tsop: CountIf(tss, OperatorCouldFix), tsnr: CountIf(tss, Outcome.Value = "Not resolved - escalated"), tsu: CountIf(tss, IsBlank(EventKey)),
                   pcd: CountRows(pcs), pcf: CountIf(pcs, Result.Value = "Fail"),
                   esc: CountRows(Filter(colPEsc, StartsWith(ShiftKey, L & "-") && IfError(Value(Mid(ShiftKey, Len(L) + 2, 8)), 0) >= K0 && IfError(Value(Mid(ShiftKey, Len(L) + 2, 8)), 0) < K1 && (ddPShift.Selected.Value = "All" || EndsWith(ShiftKey, "-S" & ddPShift.Selected.Value)))),
                   ao: CountRows(nws), ov: CountIf(nws, DueDate < DateAdd(dE, -1, TimeUnit.Days)),
                   escl: Coalesce(Max(Filter(colPEsc, StartsWith(ShiftKey, L & "-") && IfError(Value(Mid(ShiftKey, Len(L) + 2, 8)), 0) >= K0 && IfError(Value(Mid(ShiftKey, Len(L) + 2, 8)), 0) < K1 && (ddPShift.Selected.Value = "All" || EndsWith(ShiftKey, "-S" & ddPShift.Selected.Value))), Level), 0)},
              With({pcx: nEv * sh + nDy * CountRows(Distinct(shs, ShiftDate)),
                    evs: GroupBy(Filter(Ungroup(Table({t: ForAll(Filter(colPDTH, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value)), {K: ShiftKey & "|" & DT_Reason, R: DT_Reason, M: Coalesce(DT_Minutes, 0)})}, {t: ForAll(Filter(colPDTH, Line = L && ShiftDate >= dD && ShiftDate < dE && (ddPShift.Selected.Value = "All" || Text(Shift) = ddPShift.Selected.Value)), {K: ShiftKey & "|" & DT2_Reason, R: DT2_Reason, M: Coalesce(DT2_Minutes, 0)})}), t), M > 0 && !IsBlank(R)), K, R, G)},
              With({dte: CountRows(evs), dtl: Coalesce(Max(ForAll(evs, {v: Coalesce(Sum(G, M), 0)}), v), 0), mnt: CountRows(Filter(evs, R in colMR.Label && Coalesce(Sum(G, M), 0) >= varTSReq && CountRows(Filter(colPTS, EventKey = K)) = 0 && CountRows(Filter(colPWv, EventKey = K)) = 0))},
               {Line: L, VS: ln.ValueStream, Ord: ln.DisplayOrder, N: pp.N, Day: dD,
                Plan: pt, EffW: effw, Tgt: t, Act: a, OEEw: o, Shifts: sh, Scrap: sc, CrewA: ca, CrewS: cs, DT: dt, RW: rw, Saf: sf, TSn: tsn, TSop: tsop, TSnr: tsnr, TSu: tsu, MNt: mnt, PCd: pcd, PCf: pcf, PCx: pcx, Esc: esc, AO: ao, OV: ov, DTe: dte, DTl: dtl, EscL: escl, Fz: fz, Fch: fch, FA: fa,
