- btnFRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="↻"
      OnSelect: |-
        =IfError(ClearCollect(colZoneRaw, Filter(SAF_Zones, Active = true)), Notify("Could not load SAF_Zones: " & FirstError.Message, NotificationType.Error), true);
        IfError(ClearCollect(colRecent, Filter(SAF_Audits, AuditDate >= DateAdd(Today(), -120, TimeUnit.Days))), Notify("Could not load SAF_Audits", NotificationType.Warning), true);
        IfError(ClearCollect(colItems, Sort(Filter(SAF_Items, Active = true), ItemNo)), Notify("Could not load SAF_Items", NotificationType.Error), true);
        IfError(ClearCollect(colCfg, Filter(MDI_Config, StartsWith(Setting, "SAF_"))), Notify("Could not load MDI_Config", NotificationType.Warning), true);
        ClearCollect(colZones, ForAll(colZoneRaw As z,
          With({last: Max(Filter(colRecent, ZoneID = z.ZoneID), AuditDate), every: Switch(z.Frequency.Value, "Weekly", 7, "Biweekly", 14, "Quarterly", 92, 31)},
           {ID: z.ID, ZoneID: z.ZoneID, ZoneName: z.ZoneName, ZoneType: z.ZoneType.Value, Line: z.Line, Area: z.Area, Risk: z.RiskLevel.Value,
            Freq: z.Frequency.Value, PPE: z.RequiredPPE, Hazards: z.PrimaryHazards, StandardID: z.StandardID, Owner: z.Owner, OwnerEmail: z.OwnerEmail,
            Last: last, Due: IsBlank(last) || DateDiff(last, Today(), TimeUnit.Days) >= every,
            RiskN: Switch(z.RiskLevel.Value, "High", 1, "Medium", 2, 3)})));
        If(!varParamUsed && !IsBlank(Param("zone")), Set(varZone, LookUp(colZones, ZoneID = Param("zone"))); If(!IsBlank(varZone), Select(btnFStart), Notify("Zone " & Param("zone") & " is not in SAF_Zones (or not Active).", NotificationType.Warning)));
        Set(varParamUsed, true);
        If(IsBlank(varStep), Set(varStep, "zone"));
        Set(varLoaded, Now())
      Font: =Font.Arial
      Size: =16
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      X: =570
      Y: =72
      Width: =54
      Height: =38
