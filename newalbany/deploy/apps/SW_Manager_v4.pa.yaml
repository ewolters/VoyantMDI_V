- btnSRefresh:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="REFRESH"
      OnSelect: |-
        =IfError(ClearCollect(colStd, SW_Standards), Notify("Could not load SW_Standards — " & FirstError.Message, NotificationType.Error), true);
        IfError(ClearCollect(colAllEl, SW_Elements), Notify("Could not load SW_Elements", NotificationType.Error), true);
        IfError(ClearCollect(colCards, PC_Cards), Notify("Could not load PC_Cards", NotificationType.Error), true);
        IfError(ClearCollect(colStdPh, Filter(TS_Photos, Module.Value = "Standard work")), Notify("Could not load photos", NotificationType.Warning), true);
        IfError(ClearCollect(colCfg, MDI_Config), Notify("Could not load MDI_Config", NotificationType.Warning), true);
        IfError(ClearCollect(colLk, Filter(Lookups, Active = true)), Notify("Could not load Lookups", NotificationType.Warning), true);
        ClearCollect(colEq, Ungroup(Table({t: Table({Value: ""})}, {t: ForAll(Sort(Filter(colLk, Category.Value = "Equipment"), SortOrder), {Value: Label})}), t));
        Set(varFrom, DateAdd(Today(), -Coalesce(ddRPer.Selected.N, 30), TimeUnit.Days));
        IfError(ClearCollect(colAud, Filter(PC_Audits, ShiftDate >= varFrom)), Notify("Could not load PC_Audits", NotificationType.Warning), true);
        IfError(ClearCollect(colRes, Filter(PC_Results, Created >= varFrom)), Notify("Could not load PC_Results", NotificationType.Warning), true);
        ClearCollect(colEl, Filter(colAllEl, StandardID = varStdID));
        If(IsBlank(varTab), Set(varTab, "std"));
        Set(varLoaded, Now())
      Font: =Font.Arial
      Size: =13
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =1640
      Y: =22
      Width: =130
      Height: =48
