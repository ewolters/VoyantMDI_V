              =With({o: First(Filter(SortByColumns(Filter(colLk, Category.Value = varCat), "SortOrder", SortOrder.Ascending), SortOrder > ThisItem.SortOrder))},
               If(!IsBlank(o.ID),
                Patch(Lookups, LookUp(Lookups, ID = ThisItem.ID), {SortOrder: o.SortOrder});
                Patch(Lookups, LookUp(Lookups, ID = o.ID), {SortOrder: ThisItem.SortOrder});
                Select(dLoad)))
