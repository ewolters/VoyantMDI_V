    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =With({o: LookUp(Lookups, ID = varL.ID)},
         With({chg: Concat(Filter(Table({t: If(Text(o.Title) <> Text(Trim(dLbl.Text)), "Title: " & If(IsBlank(Text(o.Title)), "—", Text(o.Title)) & " → " & If(IsBlank(Text(Trim(dLbl.Text))), "—", Text(Trim(dLbl.Text))), "")}, {t: If(o.Category.Value <> varCat, "Category: " & If(IsBlank(o.Category.Value), "—", o.Category.Value) & " → " & If(IsBlank(varCat), "—", varCat), "")}, {t: If(Text(o.Group) <> Text(dGrp.Text), "Group: " & If(IsBlank(Text(o.Group)), "—", Text(o.Group)) & " → " & If(IsBlank(Text(dGrp.Text)), "—", Text(dGrp.Text)), "")}, {t: If(Text(o.Help) <> Text(dHelp.Text), "Help: " & If(IsBlank(Text(o.Help)), "—", Text(o.Help)) & " → " & If(IsBlank(Text(dHelp.Text)), "—", Text(dHelp.Text)), "")}, {t: If(Text(o.EquipType) <> Text(If(varCat = "Downtime", dEq.Selected.Value, Coalesce(varL.EquipType, ""))), "EquipType: " & If(IsBlank(Text(o.EquipType)), "—", Text(o.EquipType)) & " → " & If(IsBlank(Text(If(varCat = "Downtime", dEq.Selected.Value, Coalesce(varL.EquipType, "")))), "—", Text(If(varCat = "Downtime", dEq.Selected.Value, Coalesce(varL.EquipType, "")))), "")}, {t: If(Text(o.Active) <> Text(varLA), "Active: " & If(IsBlank(Text(o.Active)), "—", Text(o.Active)) & " → " & If(IsBlank(Text(varLA)), "—", Text(varLA)), "")}), !IsBlank(t)), t, "; ")},
         IfError(Patch(Lookups, If(IsBlank(varL.ID), Defaults(Lookups), LookUp(Lookups, ID = varL.ID)), {Title: Trim(dLbl.Text), Category: {Value: varCat}, Group: dGrp.Text, Help: dHelp.Text, EquipType: If(varCat = "Downtime", dEq.Selected.Value, Coalesce(varL.EquipType, "")), Active: varLA,
          SortOrder: If(IsBlank(varL.ID), Coalesce(Max(Filter(colLk, Category.Value = varCat), SortOrder), 0) + 10, varL.SortOrder)}),
          Notify("NOT SAVED: " & FirstError.Message, NotificationType.Error),
          IfError(Patch(Settings_Log, Defaults(Settings_Log), {Title: Left("Dropdowns: " & varCat & ": " & Trim(dLbl.Text), 250), ChangedAt: Now(), ChangedBy: User().FullName, ChangedByEmail: User().Email, Area: "Dropdowns", Item: Left(varCat & ": " & Trim(dLbl.Text), 250), Action: If(IsBlank(o), "Added", o.Active && !(varLA), "Retired", !o.Active && (varLA), "Restored", "Changed"), Changes: If(IsBlank(chg), "(no field changed)", chg), Reason: Trim(dRsnTxt.Text)}),
          Notify("Saved, but the change log entry failed: " & FirstError.Message, NotificationType.Warning), true);
          Notify("Reason saved", NotificationType.Success); Select(dLoad))))
