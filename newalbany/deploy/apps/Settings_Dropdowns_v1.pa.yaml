- galD:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: =SortByColumns(Filter(colLk, Category.Value = varCat && (varDAll || Active)), "SortOrder", SortOrder.Ascending)
      TemplateSize: =46
      TemplatePadding: =0
      ShowScrollbar: =true
      OnSelect: =Set(varL, ThisItem); Set(varLA, Coalesce(ThisItem.Active, false))
      TemplateFill: =If(ThisItem.ID = varL.ID, RGBA(229, 243, 243, 1), RGBA(255, 255, 255, 1))
      BorderColor: =RGBA(217, 217, 214, 1)
      BorderThickness: =1
      X: =16
      Y: =272
      Width: =1100
      Height: =798
    Children:
      - gdUp:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="▲"
            OnSelect: |-
              =With({o: Last(Filter(SortByColumns(Filter(colLk, Category.Value = varCat), "SortOrder", SortOrder.Ascending), SortOrder < ThisItem.SortOrder))},
               If(!IsBlank(o.ID),
                Patch(Lookups, LookUp(Lookups, ID = ThisItem.ID), {SortOrder: o.SortOrder});
                Patch(Lookups, LookUp(Lookups, ID = o.ID), {SortOrder: ThisItem.SortOrder});
                Select(dLoad)))
            Font: =Font.Arial
            Size: =11
            FontWeight: =FontWeight.Bold
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(0, 72, 81, 1)
            HoverFill: =ColorFade(Self.Fill, -15%)
            BorderColor: =RGBA(177, 179, 179, 1)
            BorderThickness: =1
            DisplayMode: =If(varCan, DisplayMode.Edit, DisplayMode.Disabled)
            X: =0
            Y: =6
            Width: =50
            Height: =34
      - gdDn:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="▼"
            OnSelect: |-
              =With({o: First(Filter(SortByColumns(Filter(colLk, Category.Value = varCat), "SortOrder", SortOrder.Ascending), SortOrder > ThisItem.SortOrder))},
               If(!IsBlank(o.ID),
                Patch(Lookups, LookUp(Lookups, ID = ThisItem.ID), {SortOrder: o.SortOrder});
                Patch(Lookups, LookUp(Lookups, ID = o.ID), {SortOrder: ThisItem.SortOrder});
                Select(dLoad)))
            Font: =Font.Arial
            Size: =11
            FontWeight: =FontWeight.Bold
            Fill: =RGBA(255, 255, 255, 1)
