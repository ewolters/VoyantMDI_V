         !IsBlank(LookUp(colLk, Category.Value = varCat && Lower(Title) = Lower(Trim(dLbl.Text)) && ID <> Coalesce(varL.ID, -1))), Notify("That label is already in " & varCat & ".", NotificationType.Warning),
        IfError(Patch(Lookups, If(IsBlank(varL.ID), Defaults(Lookups), LookUp(Lookups, ID = varL.ID)), {Title: Trim(dLbl.Text), Category: {Value: varCat}, Group: dGrp.Text, Help: dHelp.Text, EquipType: If(varCat = "Downtime", dEq.Selected.Value, Coalesce(varL.EquipType, "")), Active: varLA,
          SortOrder: If(IsBlank(varL.ID), Coalesce(Max(Filter(colLk, Category.Value = varCat), SortOrder), 0) + 10, varL.SortOrder)}),
         Notify("NOT SAVED: " & FirstError.Message, NotificationType.Error),
         Notify("Reason saved", NotificationType.Success); Select(dLoad)))
      Font: =Font.Arial
      Size: =14
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      DisplayMode: =If(varCan, DisplayMode.Edit, DisplayMode.Disabled)
      X: =1148
      Y: =686
      Width: =240
      Height: =50
- dNew:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="+ NEW REASON"
      OnSelect: =Set(varL, Blank()); Set(varLA, true); Reset(dLbl); Reset(dGrp); Reset(dHelp); Reset(dEq)
      Font: =Font.Arial
      Size: =13
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(0, 72, 81, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =RGBA(0, 72, 81, 1)
      BorderThickness: =1
      DisplayMode: =If(varCan, DisplayMode.Edit, DisplayMode.Disabled)
      X: =1404
      Y: =686
      Width: =220
      Height: =50
- dNote:
