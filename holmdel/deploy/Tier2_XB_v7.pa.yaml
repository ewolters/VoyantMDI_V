- btnLT:
    Control: Classic/Button@2.2.0
    Properties:
      Text: |-
        =""
      OnSelect: |-
        =If(IsBlank(varTWSel), Set(varTWSel, true));
        If(varTWSel,
          Set(varTW0, If(varFrom = varTo, DateAdd(varTo, -13, TimeUnit.Days), varFrom)); Set(varTW, DateDiff(varTW0, varTo, TimeUnit.Days) + 1),
          Set(varTW0, DateAdd(varTo, 1 - Coalesce(varTW, 30), TimeUnit.Days)); Set(varTW, Coalesce(varTW, 30)));
        Set(varSM, Date(Year(varTo), Month(varTo), 1));
        ClearCollect(colLR, Filter(colRows, L = varLine && D >= varTW0 && D <= varTo && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value)));
        ClearCollect(colTr, ForAll(Sequence(varTW) As k, With({dd: DateAdd(varTW0, k.Value - 1, TimeUnit.Days)}, With({sh: Filter(colLR, D = dd)},
         With({n: CountRows(sh), tg: Coalesce(Sum(sh, Tgt), 0), ac: Coalesce(Sum(sh, Act), 0), sc: Coalesce(Sum(sh, Scrap), 0), dt: Coalesce(Sum(sh, DT), 0),
           sr: Coalesce(Sum(sh, SR), 0), sf: Coalesce(Sum(sh, SF), 0), sn: Coalesce(Sum(sh, SN), 0),
           ow: Coalesce(Sum(Filter(sh, !IsBlank(OEE)), Tgt), 0), os: Coalesce(Sum(Filter(sh, !IsBlank(OEE)), OEE * Tgt), 0)},
          {D: dd, N: n, Tgt: tg, Act: ac, Scrap: sc, DT: dt, SR: sr, SF: sf, SN: sn,
           Ev: If(n = 0, Blank(), sr + sf + sn), Eff: If(tg > 0, ac / tg * 100, Blank()), SP: If(ac > 0, sc / ac * 100, Blank()),
           DTs: If(n = 0, Blank(), dt / n), OEE: If(ow > 0, os / ow * 100, Blank()),
           StS: If(n = 0, "N", sr > 0, "R", sf > 0, "A", "G"),
           StQ: If(n = 0 || ac = 0, "N", sc / ac * 100 >= varSR, "R", sc / ac * 100 >= varSA, "A", "G"),
           StD: If(tg = 0, "N", ac / tg * 100 >= varEG, "G", ac / tg * 100 >= varEA, "A", "R"),
           StDT: If(n = 0, "N", dt / n >= varDR, "R", dt / n >= varDA, "A", "G"),
           StO: If(ow = 0, "N", os / ow * 100 >= varOG, "G", os / ow * 100 >= varOA, "A", "R")})))));
        Set(varTS, {S: Max(2, Coalesce(Max(colTr, Ev), 0)), Q: Max(varSR * 1.5, Coalesce(Max(colTr, SP), 0)), D: Max(110, Coalesce(Max(colTr, Eff), 0)),
          C: Max(varDR * 1.3, Coalesce(Max(colTr, DTs), 0)), O: Max(100, Coalesce(Max(colTr, OEE), 0))});
        Set(varLW, With({tg: Coalesce(Sum(colLR, Tgt), 0), ac: Coalesce(Sum(colLR, Act), 0), ca: Coalesce(Sum(colLR, CrA), 0),
           ow: Coalesce(Sum(Filter(colLR, !IsBlank(OEE)), Tgt), 0), os: Coalesce(Sum(Filter(colLR, !IsBlank(OEE)), OEE * Tgt), 0)},
          {N: CountRows(colLR), Tgt: tg, Act: ac, Scrap: Coalesce(Sum(colLR, Scrap), 0), DT: Coalesce(Sum(colLR, DT), 0),
           SR: Coalesce(Sum(colLR, SR), 0), SF: Coalesce(Sum(colLR, SF), 0), SN: Coalesce(Sum(colLR, SN), 0),
           Eff: If(tg > 0, ac / tg * 100, Blank()), SP: If(ac > 0, Coalesce(Sum(colLR, Scrap), 0) / ac * 100, Blank()), OEE: If(ow > 0, os / ow * 100, Blank()),
           UPP: If(ca > 0, ac / ca, Blank()), AtT: CountIf(colLR, Tgt > 0 && Act >= Tgt), WithT: CountIf(colLR, Tgt > 0),
           Short: CountIf(colLR, Coalesce(CrA, 0) > 0 && Coalesce(CrS, 0) > 0 && CrA < CrS), Staffed: CountIf(colLR, Coalesce(CrA, 0) > 0 && Coalesce(CrS, 0) > 0),
           A: If(CountRows(Filter(colLR, !IsBlank(A))) = 0, Blank(), Average(Filter(colLR, !IsBlank(A)), A) * 100), P: If(CountRows(Filter(colLR, !IsBlank(P))) = 0, Blank(), Average(Filter(colLR, !IsBlank(P)), P) * 100), Q: If(CountRows(Filter(colLR, !IsBlank(Q))) = 0, Blank(), Average(Filter(colLR, !IsBlank(Q)), Q) * 100)}));
        ClearCollect(colLDTR, Ungroup(ForAll(colLR As r, {X: ForAll(Filter(Split(Coalesce(r.DTR, ""), "|"), !IsBlank(Value)) As p, {R: Index(Split(p.Value, "~"), 1).Value, M: IfError(Value(Index(Split(p.Value, "~"), 2).Value), 0)})}), X));
        ClearCollect(colLDT0, SortByColumns(AddColumns(GroupBy(colLDTR, R, G), Q, Sum(G, M)), "Q", SortOrder.Descending));
        Set(varcolLDTT, Max(1, Coalesce(Sum(colLDT0, Q), 0)));
        ClearCollect(colLDT, ForAll(Sequence(CountRows(colLDT0)) As i, With({r: Index(colLDT0, i.Value)}, With({cum: Sum(FirstN(colLDT0, i.Value), Q) / varcolLDTT * 100}, {N: r.R, Q: r.Q, Cum: cum, VF: cum - r.Q / varcolLDTT * 100 < 80}))));
        ClearCollect(colLScR, Ungroup(ForAll(colLR As r, {X: ForAll(Filter(Split(Coalesce(r.SCR, ""), "|"), !IsBlank(Value)) As p, {R: Index(Split(p.Value, "~"), 1).Value, M: IfError(Value(Index(Split(p.Value, "~"), 2).Value), 0)})}), X));
        ClearCollect(colLSc0, SortByColumns(AddColumns(GroupBy(colLScR, R, G), Q, Sum(G, M)), "Q", SortOrder.Descending));
        Set(varcolLScT, Max(1, Coalesce(Sum(colLSc0, Q), 0)));
        ClearCollect(colLSc, ForAll(Sequence(CountRows(colLSc0)) As i, With({r: Index(colLSc0, i.Value)}, With({cum: Sum(FirstN(colLSc0, i.Value), Q) / varcolLScT * 100}, {N: r.R, Q: r.Q, Cum: cum, VF: cum - r.Q / varcolLScT * 100 < 80}))));
        ClearCollect(colLH, ForAll(Sequence(8) As i, With({hs: Filter(ForAll(Filter(colLR, HT > 0) As r, {U: IfError(Value(Index(Split(r.H, ","), i.Value).Value), Blank()), T: r.HT}), !IsBlank(U))},
