        =Set(varMetOpen, false);
        ClearCollect(colDetSh, SortByColumns(Filter(colRows, L = varLine && D >= varFrom && D <= varTo), "D", SortOrder.Descending, "S", SortOrder.Ascending));
        Set(varDS, First(colDetSh));
        ClearCollect(colDetDT, SortByColumns(AddColumns(GroupBy(ForAll(Filter(Split(Concat(colDetSh, DTR, "|"), "|"), !IsBlank(Value)) As p, {R: Index(Split(p.Value, "~"), 1).Value, M: Value(Index(Split(p.Value, "~"), 2).Value)}), R, G), Mn, Sum(G, M)), "Mn", SortOrder.Descending));
        ClearCollect(colDetSc, SortByColumns(AddColumns(GroupBy(ForAll(Filter(Split(Concat(colDetSh, SCR, "|"), "|"), !IsBlank(Value)) As p, {I: Index(Split(p.Value, "~"), 1).Value, Q: Value(Index(Split(p.Value, "~"), 2).Value)}), I, G), Qty, Sum(G, Q)), "Qty", SortOrder.Descending));
        Set(varTWSel, true); Set(varDTab, Coalesce(varMetTab, "O")); If(varDTab <> "O", Select(btnLT)); Set(varDet, true)
