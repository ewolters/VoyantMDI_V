- btnCalc:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      OnSelect: |-
        =ClearCollect(colFloor, SortByColumns(ForAll(Filter(colLines, ddVS.Selected.Value = "All value streams" || VS = ddVS.Selected.Value) As ln,
         With({shs: Filter(colRows, L = ln.Line && D >= varFrom && D <= varTo && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))},
         With({tg: Coalesce(Sum(shs, Tgt), 0), ac: Coalesce(Sum(shs, Act), 0),
                ow: Coalesce(Sum(Filter(shs, !IsBlank(OEE)), Tgt), 0), os: Coalesce(Sum(Filter(shs, !IsBlank(OEE)), OEE * Tgt), 0),
                dtu: Coalesce(Sum(shs, DT), 0), sc: Coalesce(Sum(shs, Scrap), 0),
                sr: Coalesce(Sum(shs, SR), 0), sf: Coalesce(Sum(shs, SF), 0), sn: Coalesce(Sum(shs, SN), 0),
                cs: Coalesce(Sum(shs, CrS), 0), ca: Coalesce(Sum(shs, CrA), 0), n: CountRows(shs),
                dtt: ForAll(Filter(Split(Concat(shs, DTR, "|"), "|"), !IsBlank(Value)) As p, {R: Index(Split(p.Value, "~"), 1).Value, M: Value(Index(Split(p.Value, "~"), 2).Value)})},
          {Line: ln.Line, N: ln.N, VS: ln.VS, Ran: n > 0, Shifts: n, Tgt: tg, Act: ac,
           Eff: If(tg > 0, ac / tg * 100, Blank()), OEE: If(ow > 0, os / ow * 100, Blank()),
           DTU: dtu, DTs: dtu / Max(n, 1),
           TopR: First(SortByColumns(AddColumns(GroupBy(dtt, R, G), Mn, Sum(G, M)), "Mn", SortOrder.Descending)).R,
           Scrap: sc, ScrapPct: If(ac > 0, sc / ac * 100, Blank()), SR: sr, SF: sf, SN: sn, CrS: cs, CrA: ca,
           StS: If(n = 0, "N", sr > 0, "R", sf > 0, "A", "G"),
           StQ: If(n = 0 || ac = 0, "N", sc / ac * 100 >= varSR, "R", sc / ac * 100 >= varSA, "A", "G"),
           StD: If(tg = 0, "N", ac / tg * 100 >= varEG, "G", ac / tg * 100 >= varEA, "A", "R"),
           StDT: If(n = 0, "N", dtu / Max(n, 1) >= varDR, "R", dtu / Max(n, 1) >= varDA, "A", "G"),
           StO: If(ow = 0, "N", os / ow * 100 >= varOG, "G", os / ow * 100 >= varOA, "A", "R"),
           StP: If(cs = 0 || ca = 0, "N", ca < cs, "R", ca > cs, "A", "G"),
           E0: With({sh0: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -6, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh0, Tgt), 0) > 0, Coalesce(Sum(sh0, Act), 0) / Sum(sh0, Tgt) * 100, Blank())), E1: With({sh1: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -5, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh1, Tgt), 0) > 0, Coalesce(Sum(sh1, Act), 0) / Sum(sh1, Tgt) * 100, Blank())), E2: With({sh2: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -4, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh2, Tgt), 0) > 0, Coalesce(Sum(sh2, Act), 0) / Sum(sh2, Tgt) * 100, Blank())), E3: With({sh3: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -3, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh3, Tgt), 0) > 0, Coalesce(Sum(sh3, Act), 0) / Sum(sh3, Tgt) * 100, Blank())), E4: With({sh4: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -2, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh4, Tgt), 0) > 0, Coalesce(Sum(sh4, Act), 0) / Sum(sh4, Tgt) * 100, Blank())), E5: With({sh5: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -1, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh5, Tgt), 0) > 0, Coalesce(Sum(sh5, Act), 0) / Sum(sh5, Tgt) * 100, Blank())), E6: With({sh6: Filter(colRows, L = ln.Line && D = DateAdd(varTo, -0, TimeUnit.Days) && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value))}, If(Coalesce(Sum(sh6, Tgt), 0) > 0, Coalesce(Sum(sh6, Act), 0) / Sum(sh6, Tgt) * 100, Blank()))}))), "N", SortOrder.Ascending));
        ClearCollect(colParRaw, Ungroup(ForAll(Filter(colRows, L in colFloor.Line && D >= varFrom && D <= varTo && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value)) As r, {X: ForAll(Filter(Split(r.DTR, "|"), !IsBlank(Value)) As p, {Ln: r.L, R: Index(Split(p.Value, "~"), 1).Value, M: Value(Index(Split(p.Value, "~"), 2).Value)})}), X));
        ClearCollect(colPar, FirstN(SortByColumns(AddColumns(GroupBy(colParRaw, R, G), Mn, Sum(G, M), Lns, Concat(Distinct(G, Ln), Value, ", ")), "Mn", SortOrder.Descending), 10));
        ClearCollect(colScrRaw, Ungroup(ForAll(Filter(colRows, L in colFloor.Line && D >= varFrom && D <= varTo && (ddShift.Selected.Value = "All" || Text(S) = ddShift.Selected.Value)) As r, {X: ForAll(Filter(Split(r.SCR, "|"), !IsBlank(Value)) As p, {Ln: r.L, I: Index(Split(p.Value, "~"), 1).Value, Q: Value(Index(Split(p.Value, "~"), 2).Value)})}), X));
        ClearCollect(colScr, FirstN(SortByColumns(AddColumns(GroupBy(colScrRaw, I, G), Qty, Sum(G, Q), Lns, Concat(Distinct(G, Ln), Value, ", ")), "Qty", SortOrder.Descending), 8));
        Set(varTot, {Tgt: Coalesce(Sum(colFloor, Tgt), 0), Act: Coalesce(Sum(colFloor, Act), 0), DTU: Coalesce(Sum(colFloor, DTU), 0),
          Scrap: Coalesce(Sum(colFloor, Scrap), 0), SR: Coalesce(Sum(colFloor, SR), 0), SF: Coalesce(Sum(colFloor, SF), 0), SN: Coalesce(Sum(colFloor, SN), 0),
          CrS: Coalesce(Sum(colFloor, CrS), 0), CrA: Coalesce(Sum(colFloor, CrA), 0), Ran: CountRows(Filter(colFloor, Ran)), Lines: CountRows(colFloor),
          OEE: If(Coalesce(Sum(Filter(colFloor, !IsBlank(OEE)), Tgt), 0) > 0, Sum(Filter(colFloor, !IsBlank(OEE)), OEE * Tgt) / Sum(Filter(colFloor, !IsBlank(OEE)), Tgt), Blank())})
      Font: =Font.Arial
      Size: =12
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(0, 72, 81, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      BorderColor: =Self.Fill
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      X: =0
      Y: =0
      Width: =1
      Height: =1
      Visible: =false
